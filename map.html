<script>
  // <!-- QA16-MAPTOKEN -->
  const $=id=>document.getElementById(id), MOROCCO=[-6,31.8]; let token='';
  let map,user=null,selectedPlace=null,selectedMarker=null,userMarker=null,mode='driving',searchController;
  let tripDays=[], selectedDay=Number(new URLSearchParams(location.search).get('day')) || 1, selectedTripIndex=Number(new URLSearchParams(location.search).get('activity')) || 0, tripMarkers=[];
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const status=m=>$('status').textContent=m; const showToast=m=>{const toast=$('map-toast');if(!toast)return;toast.textContent=m;toast.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>{toast.hidden=true},3200)}; function expandMap(){const wrap=$('map-wrap');if(!wrap.classList.contains('expanded')){wrap.classList.add('expanded');document.body.classList.add('map-open');$('modes').style.display='flex';requestAnimationFrame(()=>map?.resize())}} function collapseMap(){const wrap=$('map-wrap');wrap.classList.remove('expanded');document.body.classList.remove('map-open');$('trip-panel')?.classList.remove('drawer-open');$('modes').style.display='none';requestAnimationFrame(()=>map?.resize())}
  const mapText=(key,fallback)=>window.MySindbadI18n?.getTranslation?.(window.MySindbadI18n?.getLang?.()||'ar',key)||fallback;
  const safe=(value,fallback='—')=>{if(value===null||value===undefined)return fallback;const text=String(value).trim();return !text||text==='undefined'||text==='null'?fallback:text};
  async function fetchMapWithTimeout(input, init = {}, timeoutMs = 5000){const controller=new AbortController();const timer=window.setTimeout(()=>controller.abort(),timeoutMs);const signal=init.signal&&window.AbortSignal?.any?AbortSignal.any([init.signal,controller.signal]):controller.signal;try{return await fetch(input,{...init,signal})}finally{window.clearTimeout(timer)}}
  const dist=m=>{return m>1000?(m/1000).toFixed(1)+' '+mapText('unit_km'):Math.round(m)+' '+mapText('unit_m')};
  const time=s=>{const m=Math.max(1,Math.round(s/60));return m>59?`${Math.floor(m/60)} ${mapText('unit_hour')} ${m%60} ${mapText('unit_minute')}`:`${m} ${mapText('minute')}`};
  function markerElement(current=false){const e=document.createElement('div');e.className=`marker${current?' current':''}`;return e}
  function setModeButtonsDisabled(disabled){document.querySelectorAll('[data-mode]').forEach((button)=>{button.disabled=disabled;button.title=disabled?mapText('choose_valid_place'):''})}
  function validCoords(activity){const c=activity?.coords || activity;const lat=Number(c?.lat);const lng=Number(c?.lng ?? c?.lon);return Number.isFinite(lat)&&Number.isFinite(lng)&&!(lat===0&&lng===0)?{lat,lng}:null}
  function tripData(){return window.AppState?.getTrip?.() || null}
  function tripDestination(){const trip=tripData();return window.MySindbadCity?.normalizeCityName(trip?.destinationDisplay||trip?.destination||trip?.destinationName||trip?.city||'')?.display||trip?.destinationDisplay||trip?.destination||trip?.destinationName||trip?.city||''}
  function activityTitle(activity){return activity?.title||activity?.place||activity?.name||mapText('activity_label')}
  function cityCoordsFor(trip){return validCoords(trip?.cityCoords)||validCoords({lat:trip?.lat,lng:trip?.lng})||validCoords({lat:trip?.lat,lon:trip?.lon})}
  async function resolveActivityCoords(activity){
    const direct=validCoords(activity);if(direct)return {...direct,source:activity.__coordSource||'activity'};
    const destination=tripDestination(),title=activityTitle(activity);
    if(title&&destination&&window.MySindbadGeocode){try{const result=await window.MySindbadGeocode.geocodeActivity(title,destination,cityCoordsFor(tripData()));if(result)return result}catch(error){console.warn('Activity geocode failed',error)}}
    const city=cityCoordsFor(tripData());if(city)return {...city,source:'city'};
    return {lat:MOROCCO[1],lng:MOROCCO[0],source:'morocco'};
  }
  function zoomFor(source){return source==='activity'||source==='geocode'||source==='cache'?16:source==='city'?13:5}
  function timeValue(value){const match=String(value||'').match(/(\d{1,2})(?::(\d{2}))?/);return match?Number(match[1])*60+Number(match[2]||0):9999}
  function sortedActivities(day){return [...(day?.activities||[])]}
  function readTripDays(){
    let days=window.AppState?.getItinerary?.() || [];
    if(!Array.isArray(days))days=[];
    if(!days.length){
      const activities=window.AppState?.getActivities?.()||[];
      if(activities.length){const grouped={};activities.forEach((item,index)=>{const day=Number(item.day_number||item.day)||1;(grouped[day] ||= []).push(item)});days=Object.keys(grouped).sort((a,b)=>a-b).map(day=>({day:Number(day),activities:grouped[day]}))}
    }
    return days.map((day,index)=>({...day,day:Number(day.day)||index+1,activities:sortedActivities(day)}));
  }
  function clearTripMarkers(){tripMarkers.forEach(marker=>marker.remove());tripMarkers=[]}
  function clearRoute(){if(map&&map.getSource('route')){if(map.getLayer('route-line'))map.removeLayer('route-line');map.removeSource('route')}}
  function fitCoordinates(points){if(!map||!points.length)return;const bounds=points.reduce((b,p)=>b.extend([p.lng,p.lat]),new mapboxgl.LngLatBounds([points[0].lng,points[0].lat],[points[0].lng,points[0].lat]));map.fitBounds(bounds,{padding:70,maxZoom:14})}
  function drawRoute(route){if(!map)return;clearRoute();map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:route.geometry}});map.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#D4AF37','line-width':6,'line-opacity':.9}})}
  async function drawTripRoute(points){
    clearRoute();
    if(points.length<2){$('trip-summary').textContent=points.length?mapText('map_one_activity','One activity · no route'):mapText('map_no_coords_summary','No coordinates');if(points.length)fitCoordinates(points);return}
    $('trip-summary').textContent=mapText('map_route_loading','Calculating route...');
    const profile=mode==='walking'?'walking':'driving';
    try{
      const coordinates=points.map(p=>`${p.lng},${p.lat}`).join(';');
      const url=`https://api.mapbox.com/directions/v5/mapbox/${profile}/${coordinates}?alternatives=false&geometries=geojson&overview=full&access_token=${encodeURIComponent(token)}`;
      const response=await fetchMapWithTimeout(url);if(!response.ok)throw new Error('directions');
      const data=await response.json();const route=data.routes?.[0];if(!route)throw new Error('no_route');
      drawRoute(route);$('trip-summary').textContent=`${dist(route.distance)} · ${time(route.duration)}`;status(`${mapText('trip_plan','Daily plan')} ${selectedDay}.`);
    }catch(error){fitCoordinates(points);$('trip-summary').textContent=mapText('map_route_failed','Unable to calculate the route right now.');status(mapText('map_route_failed','Unable to calculate the route right now.'))}
  }
  function renderTripDay(focusIndex=selectedTripIndex, filter=''){
    tripDays=readTripDays();const select=$('trip-day'),list=$('trip-activities'),empty=$('trip-empty');
    select.innerHTML=tripDays.length?tripDays.map((day,index)=>`<option value="${index+1}">${mapText('day_label','Day')} ${day.day||index+1}</option>`).join(''):`<option value="1">${mapText('map_no_days','No days')}</option>`;
    const day=tripDays.find(item=>item.day===selectedDay)||tripDays[selectedDay-1]||tripDays[0];
    if(!day){selectedDay=1;list.innerHTML='';empty.textContent=mapText('map_empty','Create a trip or add activities to view them on the map.');empty.hidden=false;clearTripMarkers();clearRoute();$('trip-summary').textContent=mapText('map_no_trip','No trip selected');return}
    selectedDay=day.day;select.value=String(selectedDay);const activities=sortedActivities(day),withCoords=activities.map(validCoords).filter(Boolean);empty.hidden=activities.length>0;empty.textContent=activities.length&&!withCoords.length?mapText('map_no_coords','Could not locate this activity'):mapText('map_empty','Create a trip or add activities to view them on the map.');
    const query=String(filter||'').trim().toLowerCase();
    list.innerHTML=activities.map((activity,index)=>({ activity,index })).filter(({activity})=>!query||activityTitle(activity).toLowerCase().includes(query)).map(({activity,index})=>{const c=validCoords(activity);return `<button type="button" class="trip-activity${index===focusIndex?' current':''}" data-trip-index="${index}"><span class="number">${index+1}</span><span><strong>${esc(safe(activity.place||activity.name||activity.title,mapText('activity_label')))}</strong><small>${c?`${esc(safe(activity.time))} · ${esc(safe(activity.duration))}`:mapText('map_no_coords','Could not locate this activity')}</small></span></button>`}).join('');
    list.querySelectorAll('[data-trip-index]').forEach(button=>button.addEventListener('click',()=>{selectedTripIndex=Number(button.dataset.tripIndex);expandMap();renderTripDay(selectedTripIndex);focusTripActivity(selectedTripIndex)}));
    clearTripMarkers();clearRoute();if(!map||!map.loaded())return;
    activities.forEach((activity,index)=>{const c=validCoords(activity);if(!c)return;const marker=new mapboxgl.Marker({element:markerElement(index===focusIndex)}).setLngLat([c.lng,c.lat]).setPopup(new mapboxgl.Popup({offset:18}).setHTML(`<strong>${esc(safe(activity.place||activity.name||activity.title,mapText('activity_label')))}</strong><br><small>${esc(safe(activity.time))}</small>`)).addTo(map);marker.getElement().addEventListener('click',()=>{selectedTripIndex=index;renderTripDay(index)});tripMarkers.push(marker)});
    if(withCoords.length)drawTripRoute(withCoords);else $('trip-summary').textContent=mapText('map_no_coords_summary','No coordinates');
    const focus=validCoords(activities[focusIndex]);if(focus)map.flyTo({center:[focus.lng,focus.lat],zoom:zoomFor(activities[focusIndex].__coordSource||'activity')});
  }
  function persistActivityCoords(activity){
    try {
      const stored=window.AppState?.getItinerary?.() || [];
      if(Array.isArray(stored)) stored.forEach(day=>(day.activities||[]).forEach(item=>{if(item.id===activity.id||item.place===activity.place){item.coords=activity.coords;item.__coordSource=activity.__coordSource;}}));
      if(Array.isArray(stored)) window.AppState?.saveItinerary?.(stored);
    } catch (error) {}
  }
  async function focusTripActivity(index){const day=tripDays.find(item=>item.day===selectedDay)||tripDays[0];const activity=day?.activities?.[index];if(!activity)return;const hadCoords=Boolean(validCoords(activity));const resolved=await resolveActivityCoords(activity);if(!hadCoords&&(!resolved||resolved.source==='city'||resolved.source==='morocco')){showToast(mapText('map_no_coords','Could not locate this activity'));return}expandMap();if(!hadCoords&&resolved){activity.coords={lat:resolved.lat,lng:resolved.lng};activity.__coordSource=resolved.source;persistActivityCoords(activity);renderTripDay(index)}const c=validCoords(activity);if(c){selectedPlace={name:activityTitle(activity),lat:c.lat,lon:c.lng};routeTo()}const marker=tripMarkers[index];if(marker&&c){marker.togglePopup();map.flyTo({center:[c.lng,c.lat],zoom:16})}status(`${mapText('map_selected','Place selected')}: ${activityTitle(activity)}`)}
  async function backfillTripCoords(){const trip=tripData();if(!trip||!window.MySindbadGeocode)return;const days=readTripDays();let changed=false;for(const day of days){for(const activity of (day.activities||[])){if(validCoords(activity))continue;const resolved=await resolveActivityCoords(activity);if(!resolved||resolved.source==='city'||resolved.source==='morocco')continue;activity.coords={lat:resolved.lat,lng:resolved.lng};activity.__coordSource=resolved.source;changed=true;}}if(changed)window.AppState?.saveItinerary?.(days);return changed}
  function routeTo(){if(!selectedPlace||!Number.isFinite(Number(selectedPlace.lat))||!Number.isFinite(Number(selectedPlace.lon))||!map){status(mapText('map_select_place','Choose a valid place first.'));return}const center=cityCoordsFor(tripData());const farFromDestination=user&&center&&window.MySindbadGeocode?.distanceKm(user,center)>300;const start=farFromDestination?center:(user||center||{lng:map.getCenter().lng,lat:map.getCenter().lat});const originLabel=farFromDestination||!user?mapText('map_route_from_city','from the city center'):mapText('map_route_from_you','from your location');$('distance').textContent=mapText('map_route_loading','Calculating route...');$('duration').textContent='—';const profile=mode==='walking'?'walking':'driving';try{const u=`https://api.mapbox.com/directions/v5/mapbox/${profile}/${start.lng},${start.lat};${selectedPlace.lon},${selectedPlace.lat}?alternatives=false&geometries=geojson&overview=full&access_token=${encodeURIComponent(token||'')}`;fetchMapWithTimeout(u).then(async response=>{if(!response.ok)throw Error('directions');const data=await response.json(),summary=data.routes?.[0];if(!summary)throw Error('no_route');drawRoute(summary);const label=`${dist(summary.distance)} · ${time(summary.duration)} ${originLabel}`;$('distance').textContent=label;$('duration').textContent=time(summary.duration);status(`${mapText('directions','Directions')} ${selectedPlace.name} · ${label}`)}).catch(()=>{clearRoute();status(mapText('map_route_failed','Unable to calculate the route right now.'));$('distance').textContent='—';$('duration').textContent='—'})}catch(e){status(mapText('map_route_failed','Unable to calculate the route right now.'))}}
  function choose(place){if(!map||!Number.isFinite(Number(place.lat))||!Number.isFinite(Number(place.lon))||(Number(place.lat)===0&&Number(place.lon)===0)){status(mapText('invalid_place'));return}expandMap();selectedPlace={...place,name:safe(place.name,mapText('map_place_selected')),lat:Number(place.lat),lon:Number(place.lon)};$('name').textContent=safe(place.name,mapText('map_place_selected'));setModeButtonsDisabled(false);$('place').classList.add('show');if(selectedMarker)selectedMarker.remove();selectedMarker=new mapboxgl.Marker({element:markerElement(true)}).setLngLat([place.lon,place.lat]).setPopup(new mapboxgl.Popup().setText(safe(place.name,mapText('map_place_selected')))).addTo(map);map.flyTo({center:[place.lon,place.lat],zoom:place.zoom||16});selectedMarker.togglePopup();routeTo()}
  async function geocode(query){if(searchController)searchController.abort();searchController=new AbortController();status(mapText('map_searching'));try{const r=await fetchMapWithTimeout(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=ar,en&q=${encodeURIComponent(query)}`,{signal:searchController.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error('search');const rows=await r.json();if(!rows.length){status(mapText('no_place_found'));return}const p=rows[0];choose({name:p.display_name?.split(',')[0]||query,lat:Number(p.lat),lon:Number(p.lon),zoom:/city|town|village|municipality|administrative|county|state|country/i.test(p.type)?13:16})}catch(e){if(e.name!=='AbortError')status(mapText('map_search_failed'))}}
  function renderSavedPlaces(){const items=window.AppState?.getActivities?.()||[];$('saved-places').innerHTML=items.length?items.filter(i=>Number.isFinite(Number(i.lat||i.coords?.lat))&&Number.isFinite(Number(i.lon||i.coords?.lng))).map(i=>{const p={name:safe(i.name||i.place,mapText('saved_place')),lat:Number(i.lat||i.coords?.lat),lon:Number(i.lon||i.coords?.lng)};return `<article class="saved-place"><div><strong>${esc(p.name)}</strong><small>${esc(safe(i.type))}</small></div><div><button data-show='${JSON.stringify(p)}'>${mapText('show')}</button><button data-route='${JSON.stringify(p)}'>${mapText('route')}</button></div></article>`}).join(''):`<p style="color:#64748b;font-size:.7rem">${mapText('add_places_hint')}</p>`}
  async function initMap(){if(!window.mapboxgl)return;mapboxgl.accessToken=token;map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/streets-v12',center:MOROCCO,zoom:5});map.addControl(new mapboxgl.NavigationControl(),'bottom-right');map.on('load',async()=>{if(user){userMarker=new mapboxgl.Marker({color:'#2674ff'}).setLngLat([user.lng,user.lat]).addTo(map)} const params=new URLSearchParams(location.search),queryLat=Number(params.get('lat')),queryLng=Number(params.get('lng')),queryName=params.get('name'),hasSelection=params.has('activity')||params.has('lat');if(Number.isFinite(queryLat)&&Number.isFinite(queryLng)&&!(queryLat===0&&queryLng===0)){choose({name:queryName||mapText('map_place_selected'),lat:queryLat,lon:queryLng})}else{await backfillTripCoords();renderTripDay(selectedTripIndex);const day=tripDays.find(item=>item.day===selectedDay)||tripDays[0],activity=day?.activities?.[selectedTripIndex];if(activity&&hasSelection){focusTripActivity(selectedTripIndex)}else if(!tripDays.length){const destination=tripDestination();if(destination)try{const r=await fetchMapWithTimeout(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ar,en&q=${encodeURIComponent(destination)}`,{headers:{Accept:'application/json'}}),rows=await r.json();if(rows[0])choose({name:rows[0].display_name?.split(',')[0]||destination,lat:Number(rows[0].lat),lon:Number(rows[0].lon),zoom:13});else status(mapText('no_trip_destination'))}catch(e){status(mapText('map_ready_no_destination'))}}}});map.on('click',e=>choose({name:mapText('map_place_selected'),lat:e.lngLat.lat,lon:e.lngLat.lng}));}
  setModeButtonsDisabled(true);
  $('trip-day').addEventListener('change',event=>{selectedDay=Number(event.target.value)||1;selectedTripIndex=0;renderTripDay(0,$('trip-search').value)});$('trip-search').addEventListener('input',event=>renderTripDay(selectedTripIndex,event.target.value));
  $('search').addEventListener('submit',e=>{e.preventDefault();const q=$('query').value.trim();if(q.length>1)geocode(q)});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));renderTripDay(selectedTripIndex);routeTo()}));  navigator.geolocation?.getCurrentPosition(p=>{user={lng:p.coords.longitude,lat:p.coords.latitude};if(map){if(userMarker)userMarker.remove();userMarker=new mapboxgl.Marker({color:'#2674ff'}).setLngLat([user.lng,user.lat]).addTo(map);status(mapText('location_found'));if(selectedPlace)routeTo();}},()=>showToast(mapText('location_access_failed')),{enableHighAccuracy:true,maximumAge:300000,timeout:5000});$('locate').addEventListener('click',()=>navigator.geolocation?.getCurrentPosition(p=>{user={lng:p.coords.longitude,lat:p.coords.latitude};if(userMarker)userMarker.remove();userMarker=new mapboxgl.Marker({color:'#2674ff'}).setLngLat([user.lng,user.lat]).setPopup(new mapboxgl.Popup().setText(mapText('current_location'))).addTo(map);map.flyTo({center:[user.lng,user.lat],zoom:15});status(mapText('location_found'));routeTo()},()=>status(mapText('location_manual'))));
  $('map-close').addEventListener('click',collapseMap); $('drawer-toggle').addEventListener('click',()=>{$('trip-panel').classList.toggle('drawer-open')});
  $('add').addEventListener('click',async()=>{if(!selectedPlace)return;const ok=await window.AppState?.addActivity?.({id:`map-${selectedPlace.lat}-${selectedPlace.lon}`,name:selectedPlace.name,place:selectedPlace.name,description:mapText('map_destination'),type:mapText('map_destination'),lat:selectedPlace.lat,lon:selectedPlace.lon,coords:{lat:selectedPlace.lat,lng:selectedPlace.lon},distance:$('distance').textContent,duration:$('duration').textContent,time:'10:00',addedAt:new Date().toISOString()});if(ok){$('add').textContent='✓ '+mapText('activity_added_trip');renderSavedPlaces();renderTripDay(selectedTripIndex);status(mapText('saved_success'))}});
  $('saved-places').addEventListener('click',e=>{const b=e.target;if(b.dataset.show||b.dataset.route){const p=JSON.parse(b.dataset.show||b.dataset.route);choose(p);if(b.dataset.route)routeTo()}});
  window.addEventListener('storage',()=>{renderSavedPlaces();if(map?.loaded())renderTripDay(selectedTripIndex)});window.addEventListener('appstate:activity-added',()=>{renderSavedPlaces();if(map?.loaded())renderTripDay(selectedTripIndex)});renderSavedPlaces();
  renderTripDay(selectedTripIndex);
  // <!-- QA16-MAPTOKEN: fetch the Vercel environment token before creating the map -->
  (async function(){try{const r=await fetchMapWithTimeout('/api/map-token');if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();if(d.token){window.__MAPBOX_TOKEN__=d.token}else throw new Error('Empty Mapbox token')}catch(e){console.error('map-token fetch failed',e)}if(window.__MAPBOX_TOKEN__){token=window.__MAPBOX_TOKEN__;mapboxgl.accessToken=window.__MAPBOX_TOKEN__;initMap()}else{$('map').innerHTML=`<p style="color:#fff;text-align:center;padding:2rem">${mapText('map_load_failed')}</p>`}})();
</script>
