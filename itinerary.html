<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>برنامج الرحلة — My Sindbad</title>
  <meta name="theme-color" content="#0A192F">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/jpeg" href="./icons/brand-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./utils/navigation.css">
  <link rel="stylesheet" href="./utils/header.css">
   <script src="https://cdn.tailwindcss.com"></script>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <script src="./utils/supabaseClient.js"></script>
   <script src="./utils/auth.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 900: '#0A192F', 800: '#243b53', 700: '#334e68' },
            gold: { 50: '#fffaf0', 400: '#ffcc33', 500: '#D4AF37', 600: '#b8941f' },
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --navy-900: #0A192F;
      --navy-800: #243b53;
      --gold: #D4AF37;
      --gold-dark: #b8941f;
    }
    * { box-sizing: border-box; font-family: 'Cairo', system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #060e1a; color: #0c1624; }
    .shell { width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto; padding-bottom: calc(88px + env(safe-area-inset-bottom)); background: #fbf9f5; box-shadow: 0 0 60px rgba(0,0,0,.28); }
    .loading-screen { min-height: 100vh; background: linear-gradient(160deg, #060e1a, #0A192F 58%, #243b53); }
    .bot-orbit { animation: orbit 2.2s linear infinite; }
    .bot-pulse { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .42; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
    .activity-card { animation: rise .45s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    dialog { border: 0; border-radius: 1.5rem; padding: 0; width: min(92vw, 430px); box-shadow: 0 24px 70px rgba(0,0,0,.3); }
    dialog::backdrop { background: rgba(6,14,26,.7); backdrop-filter: blur(4px); }
    .edit-field { width: 100%; border: 2px solid #e5e7eb; border-radius: .75rem; padding: .65rem .8rem; outline: none; }
    .edit-field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,.15); }
      .image-fallback { background: linear-gradient(135deg, #0A192F, #D4AF37); }
      .image-fallback-label { display: none; }
      .image-fallback .image-fallback-label { display: block; }
    @media (min-width: 700px) { .shell { margin: 22px auto; min-height: calc(100vh - 44px); border-radius: 28px; overflow: hidden; } }
  </style>
</head>
<body>
  <div id="aiLoadingScreen" class="fixed inset-0 bg-navy-900/95 z-50 flex flex-col items-center justify-center hidden">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-gold-500 mb-4"></div>
    <p class="text-gold-500 text-lg font-bold animate-pulse">مولد الخطط الذكي يحلل تفضيلاتك...</p>
    <p class="text-white text-sm mt-2">جاري حساب المسافات والميزانية</p>
  </div>
  <div id="loading" class="loading-screen flex flex-col items-center justify-center px-6 text-center text-white">
    <div class="relative mb-7 flex h-28 w-28 items-center justify-center">
      <div class="bot-orbit absolute inset-0 rounded-full border-2 border-dashed border-gold-500/70"></div>
      <div class="bot-pulse flex h-20 w-20 items-center justify-center rounded-3xl border border-gold-400/40 bg-white/10 text-4xl shadow-[0_0_35px_rgba(212,175,55,.2)]">🤖</div>
    </div>
    <h1 class="text-xl font-extrabold text-gold-400">مولد الخطط الذكي يجهز رحلتك الآن...</h1>
    <p class="mt-3 text-sm text-white/65">نرتب لك أياماً مليئة بالتجارب المناسبة لأسلوبك.</p>
    <div class="mt-7 h-1.5 w-48 overflow-hidden rounded-full bg-white/15"><div class="h-full w-1/2 animate-pulse rounded-full bg-gold-500"></div></div>
  </div>

  <main id="app" class="shell hidden"></main>

  <dialog id="edit-dialog">
    <form id="edit-form" class="bg-white p-5" method="dialog">
      <div class="mb-5 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold text-gold-600">تعديل النشاط</p>
          <h2 class="mt-1 text-xl font-extrabold text-navy-900">خصّص برنامجك</h2>
        </div>
        <button type="button" id="close-edit" class="rounded-xl bg-gray-100 px-3 py-2 text-lg text-gray-600" aria-label="إغلاق">×</button>
      </div>
      <div class="space-y-3">
        <label class="block text-xs font-bold text-slate-500">الوقت<input id="edit-time" class="edit-field mt-1" required></label>
        <label class="block text-xs font-bold text-slate-500">المكان<input id="edit-place" class="edit-field mt-1" required></label>
        <label class="block text-xs font-bold text-slate-500">النشاط<input id="edit-activity" class="edit-field mt-1" required></label>
        <div class="grid grid-cols-2 gap-3">
          <label class="block text-xs font-bold text-slate-500">المسافة<input id="edit-distance" class="edit-field mt-1" required></label>
          <label class="block text-xs font-bold text-slate-500">المدة<input id="edit-duration" class="edit-field mt-1" required></label>
        </div>
      </div>
      <div class="mt-5 grid grid-cols-2 gap-3">
        <button type="submit" class="rounded-xl bg-gold-500 px-4 py-3 text-sm font-bold text-white hover:bg-gold-600">حفظ التعديل</button>
        <button type="button" id="cancel-edit" class="rounded-xl bg-gray-200 px-4 py-3 text-sm font-bold text-gray-700">إلغاء</button>
      </div>
    </form>
  </dialog>

  <script src="./utils/appState.js"></script>
  <script>
    const loading = document.getElementById('loading');
    const aiLoadingScreen = document.getElementById('aiLoadingScreen');
    const app = document.getElementById('app');
    const editDialog = document.getElementById('edit-dialog');
    const editForm = document.getElementById('edit-form');
    let tripData = null;
    let itinerary = [];
    let editing = { day: 0, activity: 0 };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }
    function resolveTripImage(dest) {
      const d = (dest || '').toLowerCase();
      if (d.includes('مراكش') || d.includes('marrakech') || d.includes('المغرب') || d.includes('morocco')) return 'https://image.qwenlm.ai/public_source/e519404d-4d50-460e-a07e-5e2fe0b81811/87cd0db02-30ad-437f-9eec-3aa3c0dcbdf49390.png';
      if (d.includes('شفشاون') || d.includes('chefchaouen')) return 'https://image.qwenlm.ai/public_source/e519404d-4d50-460e-a07e-5e2fe0b81811/5a74e70c6-0b49-4321-9579-b1ec180e57da4916.png';
      return 'https://image.qwenlm.ai/public_source/e519404d-4d50-460e-a07e-5eec-3aa3c0dcbdf49390.png';
    }

    function formatDate(dateString) {
      const date = new Date(`${dateString}T12:00:00`);
      return new Intl.DateTimeFormat('ar-MA', { day: 'numeric', month: 'long', year: 'numeric' }).format(date);
    }

    function addDays(dateString, amount) {
      const date = new Date(`${dateString}T12:00:00`);
      date.setDate(date.getDate() + amount);
      return date.toISOString().split('T')[0];
    }

    function getDayCount(data) {
      const start = new Date(`${data.dates.start}T12:00:00`);
      const end = new Date(`${data.dates.end}T12:00:00`);
      const days = Math.floor((end - start) / 86400000) + 1;
       // <!-- QA14-GEN -->
       return Math.max(1, Number.isFinite(days) ? days : 1);
    }

    function generateMockItinerary(data) {
      const destination = data.destination || 'وجهتك';
      const style = data.travelStyle || 'ثقافي';
      const templates = {
        استرخاء: [
          ['09:00 ص', `شاطئ ${destination}`, 'صباح هادئ على الشاطئ', '15 دقيقة بالسيارة', 'ساعتان'],
          ['12:30 م', 'مطعم محلي مطل على البحر', 'غداء خفيف وتجربة نكهات محلية', '8 دقائق بالسيارة', 'ساعة ونصف'],
          ['04:00 م', `سبا ${destination}`, 'جلسة استرخاء وعناية', '12 دقيقة بالسيارة', 'ساعتان']
        ],
        مغامرة: [
          ['08:00 ص', `مسار جبلي في ${destination}`, 'مشي واستكشاف الطبيعة', '20 دقيقة بالسيارة', '3 ساعات'],
          ['12:30 م', 'مخيم الرحالة', 'غداء في الهواء الطلق', '500 متر مشياً', 'ساعة'],
          ['04:00 م', 'نقطة الإطلالة', 'غروب مليء بالمغامرة والتصوير', '25 دقيقة بالسيارة', 'ساعتان']
        ],
        ثقافي: [
          ['09:00 ص', `المدينة القديمة في ${destination}`, 'جولة تعريفية بين المعالم', '500 متر مشياً', 'ساعتان'],
          ['12:30 م', 'مطعم تراثي', 'غداء تقليدي وتجربة محلية', '10 دقائق بالسيارة', 'ساعة ونصف'],
          ['03:30 م', 'متحف ومعلم تاريخي', 'اكتشاف تاريخ وثقافة المكان', '700 متر مشياً', 'ساعتان']
        ],
        عائلي: [
          ['09:30 ص', 'حديقة العائلة', 'ألعاب وأنشطة مناسبة للجميع', '12 دقيقة بالسيارة', 'ساعتان'],
          ['01:00 م', 'مطعم عائلي', 'غداء مريح للجميع', '5 دقائق بالسيارة', 'ساعة ونصف'],
          ['04:00 م', 'مركز ترفيهي', 'وقت ممتع للصغار والكبار', '15 دقيقة بالسيارة', 'ساعتان']
        ],
        رومانسي: [
          ['10:00 ص', 'مقهى بإطلالة', 'فطور هادئ لشخصين', '10 دقائق بالسيارة', 'ساعة ونصف'],
          ['02:00 م', `أجمل معالم ${destination}`, 'جولة خاصة والتقاط الصور', '15 دقيقة بالسيارة', 'ساعتان'],
          ['07:00 م', 'مطعم رومانسي', 'عشاء على ضوء الشموع', '8 دقائق بالسيارة', 'ساعتان']
        ],
        اقتصادي: [
          ['09:00 ص', 'ساحة المدينة', 'جولة مجانية بين الشوارع القديمة', '400 متر مشياً', 'ساعتان'],
          ['12:00 م', 'سوق شعبي', 'غداء وتسوق بأسعار مناسبة', '700 متر مشياً', 'ساعتان'],
          ['04:00 م', 'حديقة عامة', 'استراحة واستكشاف مجاني', '10 دقائق بالحافلة', 'ساعة ونصف']
        ]
      };
      const selected = templates[style] || templates.ثقافي;
      const marrakechDays = [
        [['09:00 ص','الوصول إلى مراكش','الوصول وتسجيل الدخول في الرياض','15 دقيقة بالسيارة','ساعة'],['06:00 م','ساحة جامع الفنا','استكشاف الساحة عند الغروب','10 دقائق مشياً','ساعتان']],
        [['09:00 ص','حديقة ماجوريل','جولة بين النباتات والألوان','20 دقيقة بالسيارة','ساعتان'],['12:00 م','متحف إيف سان لوران','اكتشاف عالم الأزياء والتصميم','5 دقائق مشياً','ساعة ونصف']],
        [['10:00 ص','قصر الباهية','زيارة القصر والعمارة الأندلسية','15 دقيقة بالسيارة','ساعتان'],['01:00 م','سوق التوابل','تجربة الروائح والتسوق المحلي','8 دقائق مشياً','ساعتان']],
        [['08:00 ص','جولة الأطلس','مشاهد جبلية وتجربة الطبيعة','ساعة بالسيارة','4 ساعات'],['02:00 م','شلالات أوزود','نزهة قرب الشلالات','30 دقيقة بالسيارة','ساعتان']],
        [['10:00 ص','حمام تقليدي','جلسة عناية واسترخاء مغربية','12 دقيقة بالسيارة','ساعتان'],['07:00 م','عشاء محلي','تذوق أطباق مغربية أصيلة','10 دقائق بالسيارة','ساعتان']],
        [['10:00 ص','صباح استرخاء','وقت هادئ في الرياض','—','ساعتان'],['04:00 م','مقهى شعبي','شاي بالنعناع ومراقبة الحياة اليومية','15 دقيقة مشياً','ساعة']],
        [['09:30 ص','تسوق التذكارات','اقتناء هدايا من الأسواق القديمة','10 دقائق بالسيارة','3 ساعات']]
      ];
      const styleNotes = { رومانسي:'لحظات خاصة لشخصين', عائلي:'تجربة مناسبة لجميع أفراد العائلة', مغامرة:'تجربة مليئة بالحماس والاستكشاف', استرخاء:'وقت هادئ بعيداً عن الازدحام' };
      return Array.from({ length: getDayCount(data) }, (_, dayIndex) => ({
        day: dayIndex + 1,
        date: addDays(data.dates.start, dayIndex),
         activities: (String(destination).includes('مراكش') ? marrakechDays[dayIndex % marrakechDays.length] : selected).map((item, activityIndex) => ({
          time: item[0],
          place: item[1],
           activity: `${item[2]}${styleNotes[style] ? ` · ${styleNotes[style]}` : ''}`,
          distance: item[3],
          duration: item[4],
          added: false,
          id: `${dayIndex}-${activityIndex}`
        }))
      }));
    }

    function saveItinerary() {
      localStorage.setItem('currentItinerary', JSON.stringify(itinerary));
    }

    function normaliseTrip(data) {
      if (!data) return null;
      if (data.dates?.start) return data;
      return {
        ...data,
        dates: { start: data.start_date, end: data.end_date },
        travelers: data.travelers_count || 1,
        budget: { amount: data.budget || 0, currency: data.currency || 'MAD' },
        travelStyle: data.travel_style || 'ثقافي'
      };
    }

    async function loadCurrentTrip() {
      let currentTrip = null;
      try {
        const user = await window.Auth?.getCurrentUser();
        if (user && window.supabaseClient) {
          let { data, error } = await window.supabaseClient
            .from('trips')
            .select('*, activities(*)')
            .eq('user_id', user.id)
            .order('created_at', { ascending: false })
            .limit(1)
            .maybeSingle();
          if (error) {
            ({ data, error } = await window.supabaseClient
              .from('trips')
              .select('*')
              .eq('user_id', user.id)
              .order('created_at', { ascending: false })
              .limit(1)
              .maybeSingle());
          }
          if (data && !error) currentTrip = normaliseTrip(data);
          if (currentTrip?.activities?.length) {
            currentTrip.remoteActivities = currentTrip.activities;
          } else if (currentTrip?.id) {
            const activitiesResult = await window.supabaseClient
              .from('activities')
              .select('*')
              .eq('trip_id', currentTrip.id)
              .order('day', { ascending: true })
              .order('time', { ascending: true });
            if (!activitiesResult.error && Array.isArray(activitiesResult.data)) {
              currentTrip.remoteActivities = activitiesResult.data;
            }
          }
        }
      } catch (error) {
        console.warn('Supabase trip load failed; using local fallback:', error.message);
      }
      if (!currentTrip) {
        try {
          currentTrip = normaliseTrip(window.AppState?.getTrip())
            || normaliseTrip(JSON.parse(localStorage.getItem('currentTrip')));
        } catch (error) {
          currentTrip = null;
        }
      }
      return currentTrip;
    }

     function itineraryFromActivities(activities, trip) {
       const dayCount = getDayCount(trip);
       const grouped = new Map(Array.from({ length: dayCount }, (_, index) => [index + 1, []]));
      activities.forEach((item, index) => {
         const requestedDay = Number(item.day_number || item.day);
         const day = Number.isFinite(requestedDay) && requestedDay >= 1 && requestedDay <= dayCount
           ? requestedDay
           : (index % dayCount) + 1;
        if (!grouped.has(day)) grouped.set(day, []);
        grouped.get(day).push({
          time: item.time || '',
           place: item.place || item.name || item.place_name || 'نشاط',
           activity: item.activity || item.description || item.activity_description || '',
          distance: item.distance || '',
          duration: item.duration || '',
          added: Boolean(item.added),
          id: item.id || `${day}-${index}`
        });
      });
       return Array.from(grouped, ([day, dayActivities]) => ({
        day,
        date: day === 1 ? trip.dates.start : addDays(trip.dates.start, day - 1),
        activities: dayActivities
      }));
    }

    function renderActivity(activity, dayIndex, activityIndex) {
      return `
        <article class="activity-card rounded-2xl border border-slate-200 bg-white p-4 shadow-sm" style="animation-delay:${activityIndex * 70}ms">
          <div class="flex gap-3">
            <div class="min-w-[4.1rem] border-l border-gold-500/30 pl-3 text-center">
              <span class="block text-sm font-extrabold text-gold-600">${escapeHtml(activity.time)}</span>
              <span class="mt-2 block text-[.68rem] font-semibold text-slate-400">موعد النشاط</span>
            </div>
            <div class="min-w-0 flex-1">
              <h3 class="text-base font-extrabold text-navy-900">${escapeHtml(activity.place)}</h3>
              <p class="mt-1 text-sm font-semibold leading-6 text-slate-700">${escapeHtml(activity.activity)}</p>
              <div class="mt-3 flex flex-wrap gap-x-3 gap-y-1 text-[.7rem] text-slate-500">
                <span>⌖ ${escapeHtml(activity.distance)}</span><span>◷ ${escapeHtml(activity.duration)}</span>
              </div>
            </div>
          </div>
          <div class="mt-4 flex gap-2 border-t border-slate-100 pt-3">
            <button type="button" data-add="${dayIndex}:${activityIndex}" class="flex-1 rounded-xl px-3 py-2 text-xs font-bold transition ${activity.added ? 'bg-emerald-50 text-emerald-700' : 'bg-gold-500 text-white hover:bg-gold-600'}">${activity.added ? '✓ تمت الإضافة' : 'أضف إلى رحلتي ➕'}</button>
            <button type="button" data-edit="${dayIndex}:${activityIndex}" class="rounded-xl bg-slate-100 px-4 py-2 text-xs font-bold text-slate-700 transition hover:bg-slate-200">تعديل ✏️</button>
          </div>
        </article>`;
    }

    function render() {
      const totalBudget = tripData.budget && Number(tripData.budget.amount);
      const estimatedSpend = itinerary.length * 180;
      const remaining = totalBudget ? Math.max(0, totalBudget - estimatedSpend) : null;
      app.innerHTML = `
        <div data-site-header></div>
        <section class="px-4 pb-6 pt-6 sm:px-5">
           <div class="mb-5">
          <p class="mb-1 text-xs font-bold tracking-wide text-gold-600">MY SINDBAD · مولد الخطط الذكي</p>
            <div class="mb-4 overflow-hidden rounded-2xl bg-gradient-to-br from-navy-900 to-gold-500 text-white"><img id="tripHeaderImg" src="" alt="${escapeHtml(tripData.destination)}" class="h-36 w-full object-cover" onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, #0A192F, #D4AF37)'"><div class="p-3 text-center text-sm font-extrabold image-fallback-label">${escapeHtml(tripData.destination)}</div></div>
            <h1 id="tripDestination" class="text-2xl font-extrabold leading-relaxed text-navy-900">برنامج رحلة ${escapeHtml(tripData.destination)}</h1>
            <p class="mt-1 text-sm leading-7 text-slate-500">خطة يومية مقترحة بأسلوب ${escapeHtml(tripData.travelStyle || 'متنوع')}، ويمكنك تعديلها كما تحب.</p>
          </div>
           <div class="mb-6 grid grid-cols-3 gap-2 rounded-2xl bg-navy-900 p-3 text-white shadow-lg">
             <div class="border-l border-white/15 px-2 text-center"><span class="block text-[.66rem] text-white/60">الوجهة</span><strong id="tripDestination" class="mt-1 block truncate text-sm text-gold-400">${escapeHtml(tripData.destination)}</strong></div>
             <div class="border-l border-white/15 px-2 text-center"><span class="block text-[.66rem] text-white/60">عدد الأيام</span><strong id="tripDays" class="mt-1 block text-sm">${itinerary.length} أيام</strong></div>
             <div class="px-2 text-center"><span class="block text-[.66rem] text-white/60">الميزانية</span><strong id="tripBudget" class="mt-1 block truncate text-sm text-gold-400">${totalBudget ? `${totalBudget} ${escapeHtml(tripData.budget.currency || '')}` : 'غير محددة'}</strong></div>
          </div>
           <div class="mb-3 flex items-center justify-between"><h2 class="text-lg font-extrabold text-navy-900">برنامج يوم بيوم</h2></div>
          <div id="activitiesContainer" class="space-y-6"></div>
          <a href="./create-trip.html" class="mt-7 flex min-h-12 items-center justify-center rounded-xl border-2 border-navy-900 px-4 py-3 text-sm font-bold text-navy-900 transition hover:bg-navy-900 hover:text-white">تعديل بيانات الرحلة</a>
        </section>
        <nav data-site-nav data-active="trip"></nav>`;
      document.getElementById('tripHeaderImg').src = resolveTripImage(tripData.destination);
      renderDayPlan(readLiveActivities());
    }

    function readLiveActivities() {
      try {
        return window.AppState?.getActivities?.() || JSON.parse(localStorage.getItem('myTripActivities') || '[]');
      } catch (error) {
        return [];
      }
    }

    function renderDayPlan(activities) {
      if (!tripData) return;
      if (Array.isArray(activities) && activities.length) {
        itinerary = itineraryFromActivities(activities, tripData);
      }
      const container = document.getElementById('activitiesContainer');
      if (!container) return;
      container.innerHTML = itinerary.map((day) => `<section><div class="mb-3 flex items-center gap-2"><span class="flex h-8 w-8 items-center justify-center rounded-xl bg-gold-500 text-sm font-extrabold text-white">${day.day}</span><h3 class="text-sm font-extrabold text-navy-900">اليوم ${['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع'][day.day - 1] || day.day}: <span class="font-semibold text-slate-500">${formatDate(day.date)}</span></h3></div><div class="space-y-3">${day.activities.map((activity, index) => renderActivity(activity, day.day - 1, index)).join('')}</div></section>`).join('');
      container.querySelectorAll('[data-add]').forEach((button) => button.addEventListener('click', () => {
        const [dayIndex, activityIndex] = button.dataset.add.split(':').map(Number);
        const activity = itinerary[dayIndex].activities[activityIndex];
        activity.added = true;
        // <!-- QA14-SYNC -->
        window.AppState?.addActivity({
          id: activity.id,
          name: activity.place,
          place: activity.place,
          description: activity.activity,
          type: 'معلم سياحي',
          distance: activity.distance,
          duration: activity.duration,
          time: activity.time,
          day_number: itinerary[dayIndex].day
        });
        const saved = JSON.parse(localStorage.getItem('myTripActivities') || '[]');
        if (!saved.some((item) => item.id === activity.id)) saved.push({ ...activity, day: itinerary[dayIndex].day, day_number: itinerary[dayIndex].day, date: itinerary[dayIndex].date });
        localStorage.setItem('myTripActivities', JSON.stringify(saved));
        saveItinerary();
        renderDayPlan(readLiveActivities());
      }));
      container.querySelectorAll('[data-edit]').forEach((button) => button.addEventListener('click', () => {
        const [dayIndex, activityIndex] = button.dataset.edit.split(':').map(Number);
        openEditor(dayIndex, activityIndex);
      }));
    }

     // <!-- QA15-SYNC: merge every saved activity source and keep the day assignment -->
     function readStoredItinerary() {
       try {
         const value = JSON.parse(localStorage.getItem('currentItinerary') || 'null');
         return Array.isArray(value) ? value : [];
       } catch (error) { return []; }
     }

     function collectSavedActivities(savedItinerary) {
       const sources = [
         ...(tripData.remoteActivities || []),
         ...(window.AppState?.getActivities?.() || [])
       ];
       try {
         const stored = JSON.parse(localStorage.getItem('myTripActivities') || '[]');
         if (Array.isArray(stored)) sources.push(...stored);
       } catch (error) {}
       savedItinerary.forEach((day) => (day.activities || []).forEach((activity) => {
         if (activity.added) sources.push({ ...activity, day_number: day.day });
       }));
       return sources.filter((item, index, all) => item && all.findIndex((candidate) => (
         item.id && candidate.id && candidate.id === item.id
       )) === index);
     }

     function rebuildItinerary() {
       if (!tripData) return;
       const savedItinerary = readStoredItinerary();
       const activities = collectSavedActivities(savedItinerary);
       itinerary = activities.length
         ? itineraryFromActivities(activities, tripData)
         : (savedItinerary.length ? savedItinerary : generateMockItinerary(tripData));
       saveItinerary();
       if (!app.classList.contains('hidden')) {
         render();
         renderDayPlan(readLiveActivities());
       }
     }

     window.addEventListener('storage', () => rebuildItinerary());
     window.addEventListener('pageshow', () => rebuildItinerary());

    function openEditor(dayIndex, activityIndex) {
      editing = { day: dayIndex, activity: activityIndex };
      const activity = itinerary[dayIndex].activities[activityIndex];
      document.getElementById('edit-time').value = activity.time;
      document.getElementById('edit-place').value = activity.place;
      document.getElementById('edit-activity').value = activity.activity;
      document.getElementById('edit-distance').value = activity.distance;
      document.getElementById('edit-duration').value = activity.duration;
      editDialog.showModal();
    }

    editForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const activity = itinerary[editing.day].activities[editing.activity];
      activity.time = document.getElementById('edit-time').value.trim();
      activity.place = document.getElementById('edit-place').value.trim();
      activity.activity = document.getElementById('edit-activity').value.trim();
      activity.distance = document.getElementById('edit-distance').value.trim();
      activity.duration = document.getElementById('edit-duration').value.trim();
      saveItinerary();
      editDialog.close();
      render();
    });
    document.getElementById('close-edit').addEventListener('click', () => editDialog.close());
    document.getElementById('cancel-edit').addEventListener('click', () => editDialog.close());

    loading.classList.add('hidden');
    aiLoadingScreen.classList.remove('hidden');
    window.setTimeout(async () => {
      tripData = await loadCurrentTrip();
      if (!tripData || !tripData.destination || !tripData.dates || !tripData.dates.start) {
        window.location.href = './create-trip.html';
        return;
      }
       rebuildItinerary();
      loading.classList.add('hidden');
      app.classList.remove('hidden');
      render();
      document.getElementById('aiLoadingScreen').classList.add('hidden');
    }, 2500);
  </script>
  <script src="./utils/navigation.js"></script>
  <script src="./utils/header.js"></script>
</body>
