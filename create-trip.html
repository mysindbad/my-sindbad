    body {
      margin: 0;
      min-height: 100vh;
      background: #060e1a;
      color: #0c1624;

    .shell {
      width: 100%;
      max-width: 480px;

<script>
    const t = (key, fallback = '') => window.MySindbadI18n?.getTranslation?.(window.MySindbadI18n?.getLang?.() || 'ar', key) || fallback;
    const form = document.getElementById('trip-form');
    const startDate = document.getElementById('start-date');
    const endDate = document.getElementById('end-date');
    const successMessage = document.getElementById('success-message');
    const formError = document.getElementById('form-error');
    const destinationInput = document.getElementById('destination');
    const destinationQuery = new URLSearchParams(window.location.search).get('dest');
    if (destinationQuery) destinationInput.value = destinationQuery;

    const today = new Date().toISOString().split('T')[0];
    const maxDate = new Date();
    maxDate.setFullYear(maxDate.getFullYear() + 2);
    const maxDateValue = maxDate.toISOString().split('T')[0];
    const CITY_COORDS = {'مراكش': { lat: 31.63, lng: -7.99 }, 'شفشاون': { lat: 35.17, lng: -5.27 }, 'أغادير': { lat: 30.42, lng: -9.60 }, 'الرباط': { lat: 34.02, lng: -6.84 }, 'الدار البيضاء': { lat: 33.57, lng: -7.59 }, 'فاس': { lat: 34.03, lng: -5.00 }, 'مكناس': { lat: 33.89, lng: -5.55 }, 'طنجة': { lat: 35.76, lng: -5.83 }};
    async function fetchWithTimeout(input, init = {}, timeoutMs = 5000) { const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), timeoutMs); try { return await fetch(input, { ...init, signal: controller.signal }); } finally { clearTimeout(timer); } }
    async function cityCoordsFor(name) {
      const known = Object.entries(CITY_COORDS).find(([city]) => String(name || '').includes(city));
      if (known) return known[1];
      try {
        const response = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ar&q=${encodeURIComponent(name)}`, { headers: { Accept: 'application/json' } });
        const [first] = await response.json();
        const lat = Number(first?.lat), lng = Number(first?.lon);
        if (Number.isFinite(lat) && Number.isFinite(lng) && !(lat === 0 && lng === 0)) return { lat, lng };
      } catch (error) { /* no city center available */ }
      return null;
    }
    startDate.min = today > startDate.min ? today : startDate.min;
    endDate.min = startDate.min;
    startDate.max = maxDateValue;
    endDate.max = maxDateValue;
    startDate.addEventListener('change', () => { endDate.min = startDate.value || startDate.min; });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      formError.classList.add('hidden');
      if (endDate.value < startDate.value) {
        formError.textContent = t('return_date_invalid');
        formError.classList.remove('hidden');
        return;
      }

      const data = new FormData(form);
      const normalizedDestination = window.MySindbadCity?.normalizeCityName(data.get('destination')) || { display: String(data.get('destination') || '').trim() };
      const destinationDisplay = normalizedDestination.display || String(data.get('destination') || '').trim();
      const tripData = {
        destination: destinationDisplay,
        destinationDisplay,
        start_date: data.get('startDate'),
        end_date: data.get('endDate'),
        travelers_count: parseInt(data.get('travelers'), 10) || 1,
        budget: parseFloat(data.get('budget')) || 0,
        currency: data.get('currency') || 'MAD',
        travel_style: data.get('travelStyle'),
        status: 'active',
      };
      const trip = {
        destination: tripData.destination,
        destinationDisplay: tripData.destinationDisplay,
        dates: { start: tripData.start_date, end: tripData.end_date },
        travelers: tripData.travelers_count,
        budget: { amount: tripData.budget, currency: tripData.currency },
        travelStyle: tripData.travel_style,
        preferences: data.getAll('preferences'),
        createdAt: new Date().toISOString(),
      };
      const planRequest = {
        destination: trip.destination,
        startDate: trip.dates.start,
        endDate: trip.dates.end,
        travelers: trip.travelers,
        budget: trip.budget.amount,
        currency: trip.budget.currency,
        travelStyle: trip.travelStyle,
        preferences: trip.preferences
      };
      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = t('saving_trip');
      try {
        const user = window.supabaseClient
          ? (await window.supabaseClient.auth.getUser()).data.user
          : null;
        if (user) {
          tripData.user_id = user.id;
          const { error } = await window.supabaseClient.from('trips').insert([tripData]);
          if (error) throw error;
        } else {
          const currentTrips = JSON.parse(localStorage.getItem('trips') || '[]');
          currentTrips.push({ ...tripData, id: Date.now().toString() });
          localStorage.setItem('trips', JSON.stringify(currentTrips));
        }
        // Cache the latest trip for itinerary.html and the offline demo experience.
        trip.cityCoords = await cityCoordsFor(trip.destination);
        const unifiedTrip = {
          ...trip,
          city: trip.destination,
          destinationName: trip.destination,
          from: trip.dates.start,
          to: trip.dates.end,
          days: [[]],
          check: [t('passport'), t('travel_tickets'), t('hotel_booking'), t('travel_insurance'), t('phone_charger')].map((t) => ({ t, done: false })),
          cityCoords: trip.cityCoords
        };
        window.AppState?.saveTrip?.(unifiedTrip);
        const savedTrips = JSON.parse(localStorage.getItem('savedTrips') || '[]');
        if (!savedTrips.some((saved) => JSON.stringify(saved) === JSON.stringify(unifiedTrip))) savedTrips.unshift(unifiedTrip);
        localStorage.setItem('savedTrips', JSON.stringify(savedTrips));
        try {
          const response = await fetchWithTimeout('/api/plan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(planRequest)
          });
          if (response.ok) {
            const generatedPlan = await response.json();
            if (Array.isArray(generatedPlan.days) && generatedPlan.days.length) {
                window.AppState?.saveItinerary?.(generatedPlan.days.map((day) => ({
                day: day.day,
                date: day.date || trip.dates.start,
                activities: (day.activities || []).map((activity, index) => ({
                  id: `ai-${day.day}-${index}`,
                  time: activity.time || '',
                  place: activity.title || t('activity_label'),
                  activity: activity.desc || '',
                  distance: activity.distance || '',
                  duration: activity.duration || '',
                  coords: activity.coords || null,
                  cost: Number.isFinite(Number(activity.cost)) ? Number(activity.cost) : null,
                  category: activity.category || 'activities',
                  costEstimated: activity.costEstimated !== false,
                  costLabel: activity.costLabel || t('estimated_label'),
                  currency: activity.currency || trip.budget.currency,
                  added: false
                }))
                              })));
              }

          }
        } catch (error) {
          // The itinerary page silently uses its local generator when the API is unavailable.
        }
      } catch (error) {
        submitButton.disabled = false;
        submitButton.textContent = t('create_ai');
        formError.textContent = error.message?.includes('relation') || error.message?.includes('trips')
          ? t('supabase_table_missing')
          : t('save_trip_error');
        formError.classList.remove('hidden');
        return;
      }
      successMessage.classList.add('show');
      form.querySelector('button[type="submit"]').disabled = true;
      window.setTimeout(() => { window.location.href = './index.html'; }, 2000);
    });
  </script>
