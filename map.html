<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>الخريطة — My Sindbad</title>
  <meta name="theme-color" content="#0A192F">
  <link rel="icon" type="image/jpeg" href="./icons/brand-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./utils/navigation.css">
  <link rel="stylesheet" href="./utils/header.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./utils/supabaseClient.js"></script>
  <script src="./utils/auth.js"></script>
  <script src="./utils/appState.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css">
  <style>
    :root{--navy:#0A192F;--gold:#D4AF37;--dark:#b8941f;--bg:#fbf9f5;--line:#e8ecf2}
    *{box-sizing:border-box;font-family:Cairo,system-ui,sans-serif}body{margin:0;min-height:100vh;background:#060e1a;color:#0c1624}
    .shell{width:100%;max-width:480px;min-height:100vh;margin:auto;padding-bottom:calc(86px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 0 60px #0005}
    .header{position:sticky;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;min-height:76px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:#0a192ff7;border-bottom:1px solid #d4af374d;color:#fff}
    .brand{display:flex;align-items:center;gap:.7rem;color:#fff;text-decoration:none}.brand img{width:46px;height:46px;border-radius:14px;border:1px solid #d4af3770;object-fit:cover}.brand b{display:block;color:var(--gold);font:700 1.2rem 'Playfair Display',Georgia,serif}.brand small{display:block;color:#fffb;font-size:.65rem}
    .content{padding:18px}.intro p{margin:0;color:var(--dark);font-size:.68rem;font-weight:800}.intro h1{margin:.25rem 0 14px;color:var(--navy);font-size:1.45rem;font-weight:800}
    .map-wrap{position:relative;z-index:1;overflow:hidden;border:2px solid var(--gold);border-radius:18px;box-shadow:0 12px 28px #0b1b5124}#map{height:70vh;min-height:420px;max-height:610px}
    .search{position:absolute;z-index:500;top:12px;right:12px;left:12px;display:flex;gap:7px;padding:6px;background:#fffffff2;border:1px solid #d4af3780;border-radius:14px;box-shadow:0 8px 22px #06101c2e}.search input{width:100%;min-height:40px;padding:0 .7rem;border:0;outline:0;background:transparent;color:var(--navy);font-size:.8rem}.search button,.locate{display:grid;place-items:center;min-width:42px;min-height:40px;border:0;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer;font-weight:800}.locate{position:absolute;z-index:500;bottom:14px;left:14px;border:2px solid #fff;background:var(--dark);box-shadow:0 4px 14px #0004}
    .modes{display:flex;gap:8px;margin:12px 0}.modes button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#516174;cursor:pointer;font-size:.8rem;font-weight:700}.modes button.active{border-color:var(--gold);background:#fffaf0;color:var(--navy)}
    .status{min-height:22px;margin:0 2px 8px;color:#64748b;font-size:.7rem}.place{display:none;margin-top:12px;padding:15px;border:1px solid #d4af3775;border-radius:18px;background:#0a192fe8;color:#fff;box-shadow:0 12px 28px #06101c33;backdrop-filter:blur(14px)}.place.show{display:block}.place h2{margin:0 0 7px;font-size:1rem}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.meta div{padding:8px;border:1px solid #fff2;border-radius:10px;background:#fff1}.meta small{display:block;color:#fffa;font-size:.62rem}.meta b{display:block;color:var(--gold);font-size:.78rem}.add{width:100%;min-height:44px;border:0;border-radius:12px;background:var(--gold);color:var(--navy);cursor:pointer;font-weight:800}
    .mapboxgl-ctrl-group button{color:var(--navy)!important}.marker{width:22px;height:22px;border:3px solid #fff;border-radius:50% 50% 50% 0;background:var(--gold);box-shadow:0 3px 9px #0006;transform:rotate(-45deg)}.marker:after{content:'';display:block;width:6px;height:6px;margin:5px auto;border-radius:50%;background:var(--navy)}
    .nav{position:fixed;bottom:0;left:50%;z-index:1000;display:flex;width:100%;max-width:480px;transform:translateX(-50%);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0a192ff7;border-top:1px solid #fff2;box-shadow:0 -4px 18px #0003;backdrop-filter:blur(14px)}.nav a{display:flex;min-height:52px;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;color:#fffa;text-decoration:none;font-size:.6rem}.nav a.active{background:#d4af3729;color:var(--gold);font-weight:800}
    @media(min-width:700px){body{padding:22px 0}.shell{min-height:calc(100vh - 44px);border-radius:28px;overflow:hidden}.nav{position:absolute;border-radius:0 0 28px 28px}}
    .saved-places{display:grid;gap:8px;margin-top:16px}.saved-place{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.saved-place strong{font-size:.72rem;color:var(--navy)}.saved-place small{display:block;color:#64748b;font-size:.62rem}.saved-place div:last-child{display:flex;gap:5px}.saved-place button{min-height:34px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:#fffaf0;color:var(--navy);font-size:.62rem;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
<main class="shell">
  <div data-site-header></div>
  <section class="content">
    <div class="intro"><p>MY SINDBAD · ملاحتك الذكية</p><h1>اكتشف المكان، وابدأ الرحلة</h1></div>
    <div class="map-wrap"><div id="map" aria-label="خريطة تفاعلية"></div><form class="search" id="search"><input id="query" type="search" placeholder="ابحث عن مكان أو مدينة..." aria-label="البحث عن مكان"><button aria-label="بحث">⌕</button></form><button class="locate" id="locate" type="button" aria-label="موقعي الحالي">⌖</button></div>
    <div class="modes"><button class="active" data-mode="driving" type="button">قيادة 🚗</button><button data-mode="walking" type="button">مشي 🚶</button></div>
    <p class="status" id="status" role="status">ابحث عن مكان أو اضغط على الخريطة لاختيار وجهة.</p>
    <article class="place" id="place"><h2 id="name">المكان المختار</h2><div class="meta"><div><small>المسافة</small><b id="distance">—</b></div><div><small>الوقت المتوقع</small><b id="duration">—</b></div></div><button class="add" id="add" type="button">أضف إلى رحلتي ➕</button></article>
    <!-- QA15-MAP: أماكن رحلتي تستخدم Mapbox -->
    <section><h2 style="margin:18px 0 8px;color:var(--navy);font-size:.9rem">أماكن رحلتي</h2><div id="saved-places" class="saved-places"></div></section>
  </section>
  <nav data-site-nav data-active="map"></nav>
</main>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>
<script>
  const $=id=>document.getElementById(id), MOROCCO=[-6,31.8], token=window.__MAPBOX_TOKEN__;
  let map,user=null,selected=null,selectedMarker=null,userMarker=null,routeSource=null,mode='driving',searchController;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const status=m=>$('status').textContent=m;
  const dist=m=>m>1000?`${(m/1000).toFixed(1)} كم`:`${Math.round(m)} م`;
  const time=s=>{const m=Math.max(1,Math.round(s/60));return m>59?`${Math.floor(m/60)} س و ${m%60} د`:`${m} دقيقة`};
  function markerElement(){const e=document.createElement('div');e.className='marker';return e}
  function tripDestination(){try{return window.AppState?.getTrip?.()?.destination||JSON.parse(localStorage.getItem('currentTrip')||'null')?.destination||''}catch(e){return ''}}
  function coords(v){return {type:'Point',coordinates:[Number(v.lon),Number(v.lat)]}}
  function clearRoute(){if(map&&map.getSource('route')){map.removeLayer('route-line');map.removeSource('route')}}
  function drawRoute(route){if(!map)return;clearRoute();map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:route.geometry}});map.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#D4AF37','line-width':6,'line-opacity':.9}});map.fitBounds(route.geometry.coordinates.reduce((b,c)=>b.extend(c),new mapboxgl.LngLatBounds()),{padding:50})}
  async function routeTo(){if(!selected||!map)return;const start=user||{lng:map.getCenter().lng,lat:map.getCenter().lat};$('distance').textContent='جارٍ الحساب...';$('duration').textContent='جارٍ الحساب...';const profile=mode==='walking'?'walking':'driving';try{const u=`https://api.mapbox.com/directions/v5/mapbox/${profile}/${start.lng},${start.lat};${selected.lon},${selected.lat}?alternatives=false&geometries=geojson&overview=full&access_token=${encodeURIComponent(token||'')}`;const r=await fetch(u);if(!r.ok)throw Error('directions');const data=await r.json(),summary=data.routes?.[0];if(!summary)throw Error('no_route');drawRoute(summary);$('distance').textContent=dist(summary.distance);$('duration').textContent=time(summary.duration);status(`تم تحديد المسار إلى ${selected.name}.`)}catch(e){clearRoute();status('تعذر حساب المسار الآن؛ تحقق من Mapbox Token والاتصال.');$('distance').textContent='—';$('duration').textContent='—'}}
  function choose(place){if(!map||!Number.isFinite(place.lat)||!Number.isFinite(place.lon))return;selected=place;$('name').textContent=place.name;$('place').classList.add('show');if(selectedMarker)selectedMarker.remove();selectedMarker=new mapboxgl.Marker({element:markerElement()}).setLngLat([place.lon,place.lat]).setPopup(new mapboxgl.Popup().setText(place.name)).addTo(map);map.flyTo({center:[place.lon,place.lat],zoom:Math.max(map.getZoom(),12)});routeTo()}
  async function geocode(query){if(searchController)searchController.abort();searchController=new AbortController();status('جارٍ البحث في الخريطة...');try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=ar,en&q=${encodeURIComponent(query)}`,{signal:searchController.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error('search');const rows=await r.json();if(!rows.length){status('لم نجد هذا المكان.');return}const p=rows[0];choose({name:p.display_name?.split(',')[0]||query,lat:Number(p.lat),lon:Number(p.lon)})}catch(e){if(e.name!=='AbortError')status('تعذر البحث الآن. تحقق من الاتصال وحاول مرة أخرى.')}}
  function renderSavedPlaces(){const items=window.AppState?.getActivities?.()||[];$('saved-places').innerHTML=items.length?items.filter(i=>Number.isFinite(Number(i.lat))&&Number.isFinite(Number(i.lon))).map(i=>{const p={name:i.name||i.place||'مكان محفوظ',lat:Number(i.lat),lon:Number(i.lon)};return `<article class="saved-place"><div><strong>${esc(p.name)}</strong><small>${esc(i.type||'')}</small></div><div><button data-show='${JSON.stringify(p)}'>عرض</button><button data-route='${JSON.stringify(p)}'>اتجاهات</button></div></article>`}).join(''):'<p style="color:#64748b;font-size:.7rem">أضف أماكن إلى رحلتك لتظهر هنا.</p>'}
  async function init(){if(!window.mapboxgl||!token){status('تعذر تحميل Mapbox: أضف MAPBOX_TOKEN إلى البيئة ثم أعد التحميل.');return}mapboxgl.accessToken=token;map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/streets-v12',center:MOROCCO,zoom:5});map.addControl(new mapboxgl.NavigationControl(),'bottom-right');map.on('load',async()=>{const destination=tripDestination();if(destination)try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ar,en&q=${encodeURIComponent(destination)}`,{headers:{Accept:'application/json'}}),rows=await r.json();if(rows[0])choose({name:rows[0].display_name?.split(',')[0]||destination,lat:Number(rows[0].lat),lon:Number(rows[0].lon)});else status('لم نجد وجهة الرحلة؛ الخريطة تبدأ من المغرب.')}catch(e){status('الخريطة جاهزة؛ تعذر تحديد وجهة الرحلة.')}});
  map.on('click',e=>choose({name:'المكان المختار',lat:e.lngLat.lat,lon:e.lngLat.lng}));
  }
  $('search').addEventListener('submit',e=>{e.preventDefault();const q=$('query').value.trim();if(q.length>1)geocode(q)});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));routeTo()}));$('locate').addEventListener('click',()=>navigator.geolocation?.getCurrentPosition(p=>{user={lng:p.coords.longitude,lat:p.coords.latitude};if(userMarker)userMarker.remove();userMarker=new mapboxgl.Marker({color:'#0A192F'}).setLngLat([user.lng,user.lat]).setPopup(new mapboxgl.Popup().setText('موقعك الحالي')).addTo(map);map.flyTo({center:[user.lng,user.lat],zoom:13});status('تم تحديد موقعك الحالي.');routeTo()},()=>status('لم نتمكن من الوصول إلى موقعك. يمكنك البحث يدوياً.')));
  $('add').addEventListener('click',async()=>{if(!selected)return;const ok=await window.AppState?.addActivity?.({id:`map-${selected.lat}-${selected.lon}`,name:selected.name,place:selected.name,description:'وجهة من الخريطة',type:'وجهة من الخريطة',lat:selected.lat,lon:selected.lon,distance:$('distance').textContent,duration:$('duration').textContent,time:'10:00',addedAt:new Date().toISOString()});if(ok){$('add').textContent='✓ تمت الإضافة إلى رحلتك';renderSavedPlaces();status('تم حفظ المكان في رحلتك بنجاح.')}});
  $('saved-places').addEventListener('click',e=>{const b=e.target;if(b.dataset.show||b.dataset.route){const p=JSON.parse(b.dataset.show||b.dataset.route);choose(p);if(b.dataset.route)routeTo()}});
  window.addEventListener('storage',renderSavedPlaces);renderSavedPlaces();init();
</script>
<script src="./utils/navigation.js"></script><script src="./utils/header.js"></script>
</body>
</html>
