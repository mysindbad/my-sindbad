<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>حسابي — My Sindbad</title>
<meta content="#0A192F" name="theme-color"/>
<meta content="إدارة حسابك ورحلاتك المحفوظة وتفضيلاتك في My Sindbad" name="description"/>
<link href="./manifest.json" rel="manifest"/>
<link href="./icons/brand-logo.jpg" rel="icon" type="image/jpeg"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="./utils/navigation.css" rel="stylesheet"/>
<link href="./utils/header.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./utils/supabaseClient.js" type="module"></script>
<script src="./utils/auth.js"></script>
<style>
    :root { --navy: #0A192F; --navy-soft: #243b53; --gold: #D4AF37; --gold-dark: #b8941f; --bg: #fbf9f5; --line: #e8ecf2; --muted: #64748b; --danger: #dc2626; }
    * { box-sizing: border-box; font-family: 'Cairo', system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #060e1a; color: #0c1624; }
    .shell { width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto; padding-bottom: calc(92px + env(safe-area-inset-bottom)); background: var(--bg); box-shadow: 0 0 60px #0005; }
    .header { display: flex; align-items: center; justify-content: space-between; min-height: 76px; padding: calc(14px + env(safe-area-inset-top)) 18px 12px; background: #0a192ff7; color: #fff; border-bottom: 1px solid #d4af374d; }
    .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
    .brand img { width: 44px; height: 44px; border-radius: 14px; object-fit: cover; border: 1px solid #d4af3770; }
    .brand strong { display: block; color: var(--gold); font: 700 1.18rem 'Playfair Display', Georgia, serif; }
    .brand small { display: block; color: #fffb; font-size: .64rem; }
    .home-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border: 1px solid #ffffff33; border-radius: 12px; color: #fff; text-decoration: none; font-size: .72rem; font-weight: 700; }
    .content { padding: 18px; }
    .profile-card { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 22px; color: #fff; background: linear-gradient(135deg, var(--navy), var(--navy-soft)); box-shadow: 0 12px 24px #0b1b5130; }
    .avatar { display: grid; place-items: center; flex: 0 0 68px; width: 68px; height: 68px; border: 3px solid var(--gold); border-radius: 50%; color: var(--navy); background: #fffaf0; font-size: 1.6rem; }
    .profile-card h1 { margin: 0; font-size: 1.08rem; font-weight: 800; }
    .profile-card p { margin: 4px 0 0; color: #ffffffb8; font-size: .72rem; direction: ltr; text-align: right; }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 22px 2px 10px; color: var(--navy); font-size: .9rem; font-weight: 800; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { padding: 12px 6px; text-align: center; border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: 0 6px 16px #0b1b5108; }
    .stat strong { display: block; color: var(--navy); font-size: 1.08rem; }
    .stat span { display: block; margin-top: 2px; color: var(--muted); font-size: .62rem; }
    .settings { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: #fff; }
    .setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 62px; padding: 10px 14px; border-bottom: 1px solid #f1f4f8; }
    .setting:last-child { border-bottom: 0; }
    .setting-info { display: flex; align-items: center; gap: 10px; color: var(--navy); font-size: .76rem; font-weight: 700; }
    .setting-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; color: var(--gold-dark); background: #fffaf0; font-size: 1rem; }
    select { min-height: 44px; min-width: 112px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; color: var(--navy); background: #fff; font-size: .7rem; font-weight: 700; outline: none; }
    select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px #d4af3726; }
    .toggle { position: relative; width: 48px; height: 28px; border: 0; border-radius: 99px; background: #cbd5e1; cursor: pointer; }
    .toggle::after { content: ''; position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s ease; }
    .toggle.on { background: var(--gold); }
    .toggle.on::after { transform: translateX(-20px); }
    .trips { display: grid; gap: 10px; }
    .trip { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
    .trip h3 { margin: 0; color: var(--navy); font-size: .78rem; font-weight: 800; }
    .trip p { margin: 4px 0 0; color: var(--muted); font-size: .65rem; }
    .trip-link { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 11px; border-radius: 10px; color: var(--navy); background: #fffaf0; font-size: .65rem; font-weight: 800; text-decoration: none; white-space: nowrap; }
    .empty { padding: 22px 14px; text-align: center; border: 1px dashed #cbd5e1; border-radius: 16px; color: var(--muted); background: #fff; font-size: .72rem; line-height: 1.8; }
    .logout { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; margin-top: 22px; border: 1px solid #fecaca; border-radius: 13px; color: var(--danger); background: #fff1f2; cursor: pointer; font-size: .76rem; font-weight: 800; }
    .toast { position: fixed; right: 50%; bottom: 94px; z-index: 40; display: none; transform: translateX(50%); padding: 11px 16px; border-radius: 12px; color: #fff; background: var(--navy); box-shadow: 0 8px 22px #0004; font-size: .72rem; font-weight: 700; }
    .toast.show { display: block; animation: toast .25s ease both; }
    @keyframes toast { from { opacity: 0; transform: translate(50%, 8px); } to { opacity: 1; transform: translate(50%, 0); } }
    .nav { position: fixed; bottom: 0; left: 50%; z-index: 30; display: flex; width: 100%; max-width: 480px; transform: translateX(-50%); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: #0a192ff7; border-top: 1px solid #fff2; box-shadow: 0 -4px 18px #0003; backdrop-filter: blur(14px); }
    .nav a { display: flex; min-height: 52px; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; color: #fffa; text-decoration: none; font-size: .58rem; }
    .nav a.active { color: var(--gold); background: #d4af3729; font-weight: 800; }
    @media (min-width: 700px) { .shell { margin: 22px auto; min-height: calc(100vh - 44px); border-radius: 28px; overflow: hidden; } .nav { position: absolute; border-radius: 0 0 28px 28px; } }
  </style>
<script src="./utils/i18n.js?m5=b0be6dd" type="module"></script>
<script>(function(){try{var p=localStorage.getItem('themePreference')||'auto';var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.themePreference=p;document.documentElement.dataset.theme=(p==='dark'||(p==='auto'&&d))?'dark':'light';}catch(e){document.documentElement.dataset.theme='light';}})();</script>
<link href="./theme.css" rel="stylesheet"/>
<script defer="" src="./theme.js"></script>
</head>
<body>
<main class="shell">
<div data-site-header=""></div>
<section class="content">
<section aria-labelledby="profile-title" class="profile-card">
<div aria-hidden="true" class="avatar">👤</div>
<div><h1 id="profile-title">زائر My Sindbad</h1><p id="profile-email"></p></div>
</section>
<h2 class="section-title" data-i18n="quick_view">نظرة سريعة</h2>
<section aria-label="إحصائيات الحساب" class="stats">
<div class="stat"><strong id="saved-count">0</strong><span data-i18n="saved_trips">الرحلات المحفوظة</span></div>
<div class="stat"><strong id="favorite-count">0</strong><span>المفضلة</span></div>
<div class="stat"><strong id="points-count">0</strong><span>النقاط</span></div>
</section>
<h2 class="section-title" data-i18n="settings">الإعدادات</h2>
<section aria-label="إعدادات الحساب" class="settings">
<label class="setting"><span class="setting-info"><span aria-hidden="true" class="setting-icon">文</span><span data-i18n="language">اللغة</span></span><select aria-label="اختيار اللغة" data-language-select="" id="language"><option value="ar">العربية</option><option value="en">English</option></select></label>
<label class="setting"><span class="setting-info"><span aria-hidden="true" class="setting-icon">¤</span>العملة</span><select aria-label="اختيار العملة" id="currency"><option value="MAD">MAD</option></select><small id="currency-note" style="display:block;color:#64748b;font-size:.68rem;margin-top:.25rem">العملة المدعومة حالياً: MAD.</small></label>
<div class="setting"><span class="setting-info"><span aria-hidden="true" class="setting-icon">♧</span><span data-i18n="notifications">الإشعارات</span></span><button aria-checked="false" aria-label="تفعيل الإشعارات" class="toggle" id="notifications" role="switch" type="button"></button></div>
<label class="setting"><span class="setting-info"><span aria-hidden="true" class="setting-icon">◐</span><span data-i18n="theme">المظهر</span></span><select aria-label="اختيار المظهر" id="theme"><option data-i18n="theme_auto" value="auto">تلقائي</option><option data-i18n="theme_light" value="light">نهاري</option><option data-i18n="theme_dark" value="dark">ليلي</option></select></label>
</section>
<h2 class="section-title" data-i18n="saved_trips">الرحلات المحفوظة</h2>
<section aria-live="polite" class="trips" id="saved-trips"></section>
<button class="logout" id="logout" type="button">تسجيل الخروج</button>
</section>
<nav data-active="profile" data-site-nav=""></nav>
</main>
<div aria-live="polite" class="toast" id="toast" role="status">تم حفظ الإعدادات بنجاح</div>
<script>
    const readLocal = (key, fallback) => { try { const value = localStorage.getItem(key); return value === null ? fallback : JSON.parse(value); } catch (error) { return fallback; } };
    const writeLocal = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (error) { return false; } };
    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(message = 'تم حفظ الإعدادات بنجاح') { toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2200); }
    let remoteTrips = [];
    function normaliseTrips() {
      const saved = readLocal('savedTrips', []);
      const trips = Array.isArray(saved) ? saved : [];
      const current = readLocal('currentTrip', null);
      if (current && typeof current === 'object' && !trips.some((trip) => JSON.stringify(trip) === JSON.stringify(current))) trips.unshift(current);
      const appTrip = window.AppState?.getTrip?.() || readLocal('mysindbad_app_data_v1', {}).currentTrip;
      if (appTrip && typeof appTrip === 'object' && !trips.some((trip) => JSON.stringify(trip) === JSON.stringify(appTrip))) trips.unshift(appTrip);
      return remoteTrips.concat(trips).filter((trip) => trip && typeof trip === 'object').filter((trip, index, all) => all.findIndex((item) => (item.id && trip.id && item.id === trip.id) || JSON.stringify(item) === JSON.stringify(trip)) === index);
    }
    function tripName(trip) { return trip.destination || trip.destinationName || trip.city || trip.title || 'رحلة محفوظة'; }
    function tripDate(trip) { const start = trip.startDate || trip.start || trip.date || trip.dates?.start; return start ? `تاريخ البدء: ${start}` : 'بيانات الرحلة جاهزة للمراجعة'; }
    function renderTrips() {
      const trips = normaliseTrips();
      const activities = readLocal('myTripActivities', []);
      const savedActivities = Array.isArray(activities) ? activities.filter((activity) => activity && typeof activity === 'object') : [];
      document.getElementById('saved-count').textContent = trips.length;
      const container = document.getElementById('saved-trips');
      if (!trips.length) { container.innerHTML = '<div class="empty">لا توجد رحلات محفوظة بعد.<br>ابدأ بإنشاء رحلة جديدة لتظهر هنا.</div>'; return; }
      const tripCards = trips.map((trip) => `<article class="trip"><div><h3>${escapeHtml(tripName(trip))}</h3><p>${escapeHtml(tripDate(trip))}</p></div><a class="trip-link" href="./itinerary.html">عرض التفاصيل</a></article>`);
      const activityCards = savedActivities.map((activity) => `<article class="trip"><div><h3>${escapeHtml(activity.title || activity.place || 'نشاط محفوظ')}</h3><p>لديك نشاط محفوظ في رحلتك</p></div><a class="trip-link" href="./itinerary.html">عرض التفاصيل</a></article>`);
      container.innerHTML = tripCards.join('');
    }
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])); }
    const language = document.getElementById('language');
    const currency = document.getElementById('currency');
    const notifications = document.getElementById('notifications');
    const theme = document.getElementById('theme');
    language.value = readLocal('userLang', 'ar');
    currency.value = readLocal('userCurrency', 'MAD');
    const notificationsEnabled = Boolean(readLocal('notificationsEnabled', false));
    notifications.classList.toggle('on', notificationsEnabled); notifications.setAttribute('aria-checked', String(notificationsEnabled));
    theme.value = window.MySindbadTheme?.get?.() || readLocal('themePreference', 'auto');
    language.addEventListener('change', () => { writeLocal('userLang', language.value); showToast(); });
    currency.addEventListener('change', () => { writeLocal('userCurrency', currency.value); showToast(); });
    notifications.addEventListener('click', () => { const enabled = !notifications.classList.contains('on'); notifications.classList.toggle('on', enabled); notifications.setAttribute('aria-checked', String(enabled)); writeLocal('notificationsEnabled', enabled); showToast(enabled ? 'سيظهر تذكير checklist عند وجود رحلة.' : 'تم إيقاف تذكير checklist.'); });
    theme.addEventListener('change', () => { writeLocal('themePreference', theme.value); window.MySindbadTheme?.set?.(theme.value); showToast('تم حفظ المظهر.'); });
    if (notificationsEnabled && readLocal('currentTrip', null)) setTimeout(() => showToast('تذكير checklist: راجع قائمة التجهيزات في رحلتك.'), 700);
    document.getElementById('favorite-count').textContent = Array.isArray(readLocal('favorites', [])) ? readLocal('favorites', []).length : 0;
    document.getElementById('points-count').textContent = Number(readLocal('points', readLocal('sb_points', 0))) || 0;
    // <!-- QA14-DEMO -->
    async function loadAuthProfile() {
       if (!window.Auth) { document.getElementById('logout').classList.add('hidden'); renderTrips(); return; }
      try {
        const user = await Auth.getCurrentUser();
         if (user) {
          document.getElementById('profile-title').textContent = user.user_metadata?.full_name || user.email || 'مسافر سندباد';
          document.getElementById('profile-email').textContent = user.email || '';
          if (window.supabaseClient) {
            const result = await window.supabaseClient.from('trips').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
            if (!result.error && Array.isArray(result.data)) remoteTrips = result.data;
         } else document.getElementById('logout').classList.add('hidden');
        }
      } catch (error) { console.warn('Auth profile unavailable:', error.message); }
      renderTrips();
    }
    document.getElementById('logout').addEventListener('click', async () => {
      try { ['currentTrip', 'currentItinerary', 'myTripActivities', 'sb_trip', 'sb_destination'].forEach((key) => localStorage.removeItem(key)); } catch (error) {}
      if (window.supabaseClient) await Auth.signOut(); else { localStorage.removeItem('sb_session'); window.location.href = './index.html'; }
    });
    renderTrips();
    loadAuthProfile();
  </script>
<script src="./utils/navigation.js"></script>
<script src="./utils/header.js"></script>
<script src="./utils/appState.js"></script>
</body>
</html>
