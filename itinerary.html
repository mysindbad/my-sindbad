<script type="module">
    import { shareTrip, buildTripLink } from './utils/share.js';
    import { evaluateHealth } from './utils/health.js';
    const loading = document.getElementById('loading');
    const aiLoadingScreen = document.getElementById('aiLoadingScreen');
    const app = document.getElementById('app');
    const editDialog = document.getElementById('edit-dialog');
    const editForm = document.getElementById('edit-form');
    let tripData = null;
    let itinerary = [];
    let editing = { day: 0, activity: 0 };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }
    function tripLabel() { return tripData?.destinationDisplay || tripData?.destination || assistantText('destination_default'); }
    function travelStyleText(style) { const keys = { 'مغامرة': 'style_adventure', 'استرخاء': 'style_relaxation', 'ثقافي': 'style_cultural', 'عائلي': 'style_family', 'رومانسي': 'style_romantic', 'اقتصادي': 'style_budget' }; return assistantText(keys[style] || 'varied_style', style || assistantText('varied_style')); }
    function renderHealthCard() {
      const activities = itinerary.flatMap((day) => day.activities || []);
      const budget = Number(tripData?.budget?.amount ?? tripData?.budget ?? 0);
      const health = evaluateHealth({ trip: { ...tripData, budget, days: itinerary.length || 1 }, activities, weatherDaily: [] });
      const messages = health.checks.map((check) => `${check.type === 'green' ? '✓' : '•'} ${escapeHtml(check.message)}`).join('<br>');
      return `<section class="mt-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"><div class="flex items-center justify-between"><strong class="text-sm font-extrabold text-navy-900">${assistantText('trip_health')}</strong><b class="text-sm text-gold-600">${health.badge} ${health.score}/100</b></div><p class="mt-2 text-xs leading-6 text-slate-500">${messages}</p></section>`;
    }
    function getCityImage(cityName) { return window.MySindbadCity?.normalizeCityImage(cityName) || window.MySindbadCity?.placeholderForCategory('attraction'); }
    const placeImageCache = new Map();
    async function fetchPlaceImage(name, category) {
      const key = `${name}|${category}`;
      if (placeImageCache.has(key)) return placeImageCache.get(key);
      const fallback = window.MySindbadCity?.placeholderForCategory(category) || '';
      try {
        const response = await fetch(`https://ar.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=640&titles=${encodeURIComponent(name)}`, { headers: { Accept: 'application/json' } });
        const data = response.ok ? await response.json() : null;
        const page = Object.values(data?.query?.pages || {})[0];
        const image = page?.thumbnail?.source || fallback;
        placeImageCache.set(key, image);
        return image;
      } catch (error) {
        placeImageCache.set(key, fallback);
        return fallback;
      }
    }
    function hydratePlaceImages() {
      document.querySelectorAll('[data-place-image]').forEach((image) => {
        if (image.dataset.loaded || image.dataset.loading) return;
        image.dataset.loading = 'true';
        fetchPlaceImage(image.dataset.placeImage, image.dataset.placeCategory).then((src) => { image.src = src; image.dataset.loaded = 'true'; }).catch(() => {}).finally(() => { delete image.dataset.loading; });
      });
    }

    function formatDate(dateString) {
      const date = new Date(`${dateString}T12:00:00`);
      const lang = window.MySindbadI18n?.getLang?.() || 'ar';
      return new Intl.DateTimeFormat(lang === 'fr' ? 'fr-FR' : lang === 'en' ? 'en-US' : 'ar-MA', { day: 'numeric', month: 'long', year: 'numeric' }).format(date);
    }

    function addDays(dateString, amount) {
      const date = new Date(`${dateString}T12:00:00`);
      date.setDate(date.getDate() + amount);
      return date.toISOString().split('T')[0];
    }

    function getDayCount(data) {
      const start = new Date(`${data.dates.start}T12:00:00`);
      const end = new Date(`${data.dates.end}T12:00:00`);
      const days = Math.floor((end - start) / 86400000) + 1;
       // <!-- QA14-GEN -->
       return Math.max(1, Number.isFinite(days) ? days : 1);
    }

    function generateMockItinerary(data) {
      const destination = data.destination || 'وجهتك';
      const style = data.travelStyle || 'ثقافي';

    async function backfillMissingCoords() {
      if (!tripData || !window.MySindbadGeocode) return;
      let changed = false;
      for (const day of itinerary) {
        for (const activity of (day.activities || [])) {
          if (hasValidCoords(activity)) continue;
          const resolved = await window.MySindbadGeocode.geocodeActivity(activity.place, tripLabel(), tripData.cityCoords);
          if (!resolved) continue;
          activity.coords = { lat: resolved.lat, lng: resolved.lng };
          activity.__coordSource = resolved.source;
          changed = true;
        }
      }
      if (changed) {
        saveItinerary();
        render();

    function normaliseTrip(data) {
      if (!data) return null;
      if (data.dates?.start) return { ...data, destinationDisplay: data.destinationDisplay || data.destination || data.destinationName || data.city } ;
      return {
        ...data,
        destinationDisplay: data.destinationDisplay || data.destination || data.destinationName || data.city,
        dates: { start: data.start_date, end: data.end_date },
        travelers: data.travelers_count || 1,
        budget: { amount: data.budget || 0, currency: data.currency || 'MAD' },
        travelStyle: data.travel_style || 'ثقافي'
      };
    }

    async function loadCurrentTrip() {
      let currentTrip = null;
      try {
        const user = await window.Auth?.getCurrentUser();
        if (user && window.supabaseClient) {
          let { data, error } = await window.supabaseClient
            .from('trips')
            .select('*, activities(*)')
            .eq('user_id', user.id)
            .order('created_at', { ascending: false })
            .limit(1)
            .maybeSingle();
          if (error) {
            ({ data, error } = await window.supabaseClient
              .from('trips')
              .select('*')
              .eq('user_id', user.id)
              .order('created_at', { ascending: false })
              .limit(1)
              .maybeSingle());
          }
          if (data && !error) currentTrip = normaliseTrip(data);
          if (currentTrip?.activities?.length) {
            currentTrip.remoteActivities = currentTrip.activities;
          } else if (currentTrip?.id) {
            const activitiesResult = await window.supabaseClient
              .from('activities')
              .select('*')
              .eq('trip_id', currentTrip.id)
              .order('day', { ascending: true })
              .order('time', { ascending: true });
            if (!activitiesResult.error && Array.isArray(activitiesResult.data)) {
              currentTrip.remoteActivities = activitiesResult.data;
            }
          }
        }
      } catch (error) {
        console.warn('Supabase trip load failed; using local fallback:', error.message);
      }
      if (!currentTrip) {
        try {
          currentTrip = normaliseTrip(window.AppState?.getTrip());
        } catch (error) {
          currentTrip = null;
        }
      }
      return currentTrip;
    }

     function itineraryFromActivities(activities, trip) {
       const dayCount = getDayCount(trip);
       const grouped = new Map(Array.from({ length: dayCount }, (_, index) => [index + 1, []]));
      activities.forEach((item, index) => {
         const requestedDay = Number(item.day_number || item.day);
         const day = Number.isFinite(requestedDay) && requestedDay >= 1 && requestedDay <= dayCount
           ? requestedDay
           : (index % dayCount) + 1;
        if (!grouped.has(day)) grouped.set(day, []);
        grouped.get(day).push({
          time: item.time || '',
           place: item.place || item.name || item.place_name || assistantText('activity_label'),
           activity: item.activity || item.description || item.activity_description || '',
          distance: item.distance || '',
          duration: item.duration || '',
          coords: item.coords || (Number.isFinite(Number(item.lat)) && Number.isFinite(Number(item.lon)) ? { lat: Number(item.lat), lng: Number(item.lon) } : null),
          coordinates: item.coordinates || item.coords || (Number.isFinite(Number(item.lat)) && Number.isFinite(Number(item.lon)) ? { lat: Number(item.lat), lng: Number(item.lon) } : null),
          cost: Number.isFinite(Number(item.cost ?? item.estimated_cost)) ? Number(item.cost ?? item.estimated_cost) : null,
          category: item.category || (item.type === 'فندق' ? 'accommodation' : item.type === 'مطعم' ? 'food' : 'activities'),
          costEstimated: item.costEstimated !== false,
          costLabel: item.costLabel || 'تقديري',
          currency: item.currency || trip.budget?.currency || 'MAD',
          added: Boolean(item.added),
          id: item.id || `${day}-${index}`
        });
      });
       return Array.from(grouped, ([day, dayActivities]) => ({
        day,
        date: day === 1 ? trip.dates.start : addDays(trip.dates.start, day - 1),
        activities: dayActivities
      }));
    }

    let assistantMessages = [];

    function assistantText(key, fallback) { return window.MySindbadI18n?.getTranslation?.(window.MySindbadI18n?.getLang?.() || 'ar', key) || fallback; }

    function renderAssistantMessages() {
      const container = document.getElementById('assistant-messages');
      if (!container) return;
      container.innerHTML = assistantMessages.map((message, messageIndex) => `
        <div class="assistant-message ${message.role}"><div class="assistant-bubble">${message.loading ? `<span class="assistant-loading"><span class="assistant-spinner"></span>${escapeHtml(message.text)}</span>` : escapeHtml(message.text)}${Array.isArray(message.options) && message.options.length ? `<div class="assistant-options">${message.options.map((option, optionIndex) => `<article class="assistant-option"><strong>${escapeHtml(option.title)}</strong><small>≈ ${escapeHtml(option.cost)} ${escapeHtml(option.currency || tripData.budget?.currency || 'MAD')} · ${escapeHtml(option.reason || assistantText('same_city_alternative'))}</small><button type="button" data-assistant-option="${messageIndex}:${optionIndex}">${escapeHtml(assistantText('assistant_replace'))}</button></article>`).join('')}</div>` : ''}${message.preview ? `<div class="mt-2 rounded-lg bg-slate-100 px-2 py-1 text-[.65rem] text-slate-600">${escapeHtml(message.preview)}</div>` : ''}${message.action ? `<button type="button" class="assistant-confirm" data-assistant-action="${messageIndex}:${escapeHtml(message.action.type)}">${escapeHtml(message.action.label || assistantText('confirm'))}</button>` : ''}</div></div>`).join('');
      container.scrollTop = container.scrollHeight;
      container.querySelectorAll('[data-assistant-option]').forEach((button) => button.addEventListener('click', () => {
        const [messageIndex, optionIndex] = button.dataset.assistantOption.split(':').map(Number);
        const message = assistantMessages[messageIndex];
        const option = message?.options?.[optionIndex];
        if (option) applyAssistantReplacement(message.day, message.activityIndex, option);
      }));
      container.querySelectorAll('[data-assistant-action]').forEach((button) => button.addEventListener('click', () => {
        const [messageIndex, actionType] = button.dataset.assistantAction.split(':'); const message = assistantMessages[Number(messageIndex)];
        if (actionType === 'CONFIRM_REPLACE_OUTDOOR') sendAssistantMessage(assistantText('assistant_outdoor'));
        else if (message && applyAssistantAction(message)) { button.disabled = true; button.textContent = assistantText('added_success'); addAssistantMessage('ai', assistantText('added_success')); }
      }));
    }

    function addAssistantMessage(role, text, extra = {}) {
      assistantMessages.push({ role, text, ...extra });
      if (assistantMessages.length > 40) assistantMessages.splice(0, assistantMessages.length - 40);
      renderAssistantMessages();
    }

    function setAssistantOpen(open) {
      const sheet = document.getElementById('assistant-sheet');

    function syncAssistantReplacement(replacement, dayNumber, originalId) {
      const record = { ...replacement, id: originalId || replacement.id || `assistant-${Date.now()}`, name: replacement.place, description: replacement.activity, title: replacement.place, day: dayNumber, day_number: dayNumber, added: true };
      try {
        const state = window.AppState?.getAll?.();
        if (state) {
          state.activities = Array.isArray(state.activities) ? state.activities : [];
          const index = state.activities.findIndex((item) => item.id === record.id);
          if (index >= 0) state.activities[index] = { ...state.activities[index], ...record };
          else state.activities.push(record);
          window.AppState.saveAll(state);
        }
      } catch (error) {}
    }

    function showAssistantToast(text) {
      const toast = document.getElementById('assistant-toast');
      if (!toast) return;
      toast.textContent = text;
      toast.classList.add('show');
      window.setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function applyAssistantReplacement(dayNumber, activityIndex, option) {
      const day = itinerary.find((item) => Number(item.day) === Number(dayNumber)) || itinerary[Number(dayNumber) - 1];
      const current = day?.activities?.[activityIndex];
      if (!day || !current) return;
      const replacement = { ...current, place: option.title, activity: option.reason || current.activity, cost: Number(option.cost), coords: option.coords || null, category: option.category || current.category || 'activities', currency: option.currency || tripData.budget?.currency || 'MAD', costEstimated: true, added: true };
      day.activities[activityIndex] = replacement;
      syncAssistantReplacement(replacement, day.day, current.id);
      saveItinerary();
      assistantMessages = assistantMessages.map((message) => ({ ...message, options: [] }));
      assistantMessages.push({ role: 'ai', text: assistantText('assistant_replaced') });
      render();
      window.requestAnimationFrame(() => { setAssistantOpen(true); showAssistantToast(assistantText('assistant_replaced')); });
    }

    function applyAssistantAction(message) {
      const day = itinerary.find((item) => Number(item.day) === Number(message.day)) || itinerary[Number(message.day || 1) - 1];
      const index = Math.max(0, Number(message.activityIndex) || 0);
      if (!day) return false;
      if (message.action?.type === 'REMOVE' || message.action?.type === 'REMOVE_ACTIVITY') day.activities.splice(index, 1);
      else if (message.action?.type === 'MOVE' || message.action?.type === 'MOVE_ACTIVITY') { const targetDay = Number(message.action.toDay || message.action.targetDay) || Number(day.day) + 1; const target = itinerary.find((item) => Number(item.day) === targetDay); const [activity] = day.activities.splice(index, 1); if (!target || !activity) return false; target.activities.push(activity); }
      else if (message.action?.type === 'REPLAN') itinerary.forEach((item) => item.activities.sort((a, b) => String(a.time || '').localeCompare(String(b.time || ''))));
      else return false;
      saveItinerary(); render(); window.requestAnimationFrame(() => setAssistantOpen(true)); return true;
    }

    function assistantHistory() { return assistantMessages.filter((item) => !item.loading && item.text).slice(0, -1).slice(-5).map((item) => ({ role: item.role === 'ai' ? 'assistant' : 'user', content: item.text })); }
    async function fetchWithTimeout(input, init = {}, timeoutMs = 5000) { const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), timeoutMs); try { return await fetch(input, { ...init, signal: controller.signal }); } finally { clearTimeout(timer); } }

    // Phase 15 — Location awareness (ephemeral, in-memory, freshness 5min). No watcher, no storage.
    let assistantLocation = null;
    const ASSISTANT_LOCATION_TTL = 5 * 60 * 1000;
    async function getAssistantLocation() {
      const now = Date.now();
      if (assistantLocation && (now - assistantLocation.fetchedAt) < ASSISTANT_LOCATION_TTL) {
        return { lat: assistantLocation.lat, lng: assistantLocation.lng, accuracy: assistantLocation.accuracy };
      }
      if (!window.MSLocation || !window.MSLocation.has()) return null;
      try {
        const pos = await window.MSLocation.current({ enableHighAccuracy: false, maximumAge: 300000, timeout: 6000 });
        if (pos && Number.isFinite(pos.lat) && Number.isFinite(pos.lng) && !(pos.lat === 0 && pos.lng === 0)) {
          assistantLocation = { lat: pos.lat, lng: pos.lng, accuracy: Number.isFinite(pos.accuracy) ? pos.accuracy : null, fetchedAt: Date.now() };
          return { lat: assistantLocation.lat, lng: assistantLocation.lng, accuracy: assistantLocation.accuracy };
        }
      } catch (error) { /* DENIED | UNAVAILABLE | TIMEOUT | UNSUPPORTED → continue without location */ }
      return null;
    }

    async function sendAssistantMessage(text) {
      const message = String(text || '').trim();
      if (!message || assistantSending) return;
      assistantSending = true;
      addAssistantMessage('user', message);
      addAssistantMessage('ai', assistantText('assistant_loading'), { loading: true });
      const loadingMessageIndex = assistantMessages.length - 1;
      try {
        const location = await getAssistantLocation();
        const payload = { message, trip: assistantTripPayload(), history: assistantHistory(), language: window.MySindbadI18n?.getLang?.() || localStorage.getItem('userLang') || 'ar' };
        if (location) payload.location = location;
        const response = await fetchWithTimeout('/api/assistant', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!response.ok) throw new Error('assistant');
        const result = await response.json();
        assistantMessages.splice(loadingMessageIndex, 1);
        if (result.type === 'REPLACE_ACTIVITY') {
          const options = Array.isArray(result.options) ? result.options.filter((option) => Number(option.cost) < Number((itinerary.find((day) => Number(day.day) === Number(result.day))?.activities?.[result.activityIndex])?.cost ?? Infinity)) : [];
          addAssistantMessage('ai', options.length ? assistantText('assistant_has_options') : assistantText('assistant_no_cheaper'), { day: result.day, activityIndex: result.activityIndex, options, preview: result.preview || '' });
        } else if (['REMOVE', 'REMOVE_ACTIVITY', 'MOVE', 'MOVE_ACTIVITY', 'REPLAN'].includes(result.type)) {
          addAssistantMessage('ai', result.message || assistantText('preview_ready'), { day: result.day, activityIndex: result.activityIndex, preview: result.preview || result.message || assistantText('preview_ready'), action: { ...(result.action || {}), type: result.type, toDay: result.toDay || result.targetDay } });
        } else {
          addAssistantMessage('ai', result.message || assistantText('assistant_general_help'), { action: result.action || null, preview: result.preview || '' });
        }
      } catch (error) {
        assistantMessages.splice(loadingMessageIndex, 1);
        addAssistantMessage('ai', assistantText('assistant_error'));
      } finally {
        assistantSending = false;
      }
    }

    function wireAssistant() {
      const fab = document.getElementById('assistant-fab');
      const close = document.getElementById('assistant-close');
      const backdrop = document.getElementById('assistant-backdrop');
      const form = document.getElementById('assistant-form');
      const input = document.getElementById('assistant-input');
      if (!fab || fab.dataset.bound) return;
      fab.dataset.bound = 'true';
      fab.addEventListener('click', () => setAssistantOpen(true));
      close.addEventListener('click', () => setAssistantOpen(false));
      backdrop.addEventListener('click', () => setAssistantOpen(false));
      form.addEventListener('submit', (event) => { event.preventDefault(); const value = input.value; if (!value.trim()) { showAssistantToast(assistantText('assistant_required')); input.focus(); return; } input.value = ''; sendAssistantMessage(value); });
      document.querySelectorAll('[data-assistant-prompt]').forEach((button) => button.addEventListener('click', () => { input.value = button.dataset.assistantPrompt; input.focus(); }));
      const sheet = document.getElementById('assistant-sheet');
      const grabber = sheet.querySelector('.assistant-grabber');
      let startY = 0;
      let dragging = false;
      grabber.addEventListener('pointerdown', (event) => { startY = event.clientY; dragging = true; grabber.setPointerCapture(event.pointerId); });
      grabber.addEventListener('pointermove', (event) => { if (dragging) sheet.style.transform = `translate(50%, ${Math.max(0, event.clientY - startY)}px)`; });
      grabber.addEventListener('pointerup', (event) => { dragging = false; grabber.releasePointerCapture(event.pointerId); const moved = event.clientY - startY; sheet.style.transform = ''; if (moved > 90) setAssistantOpen(false); });
      renderAssistantMessages();
    }

    function render() {
      const totalBudget = tripData.budget && Number(tripData.budget.amount);
      const estimatedSpend = itinerary.length * 180;
      const remaining = totalBudget ? Math.max(0, totalBudget - estimatedSpend) : null;
      app.innerHTML = `
        <div data-site-header></div>
        <section class="px-4 pb-6 pt-6 sm:px-5">
           <div class="mb-5">
          <p class="mb-1 text-xs font-bold tracking-wide text-gold-600">MY SINDBAD · ${assistantText('smart_planner')}</p>
            <div class="mb-4 overflow-hidden rounded-2xl bg-gradient-to-br from-navy-900 to-gold-500 text-white"><img id="tripHeaderImg" src="" alt="${escapeHtml(tripLabel())}" class="h-36 w-full object-cover" onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, #0A192F, #D4AF37)'"><div class="p-3 text-center text-sm font-extrabold image-fallback-label">${escapeHtml(tripLabel())}</div></div>
            <h1 id="tripDestination" class="text-2xl font-extrabold leading-relaxed text-navy-900">${assistantText('trip_program')} ${escapeHtml(tripLabel())}</h1>
            <p class="mt-1 text-sm leading-7 text-slate-500">${assistantText('suggested_daily_plan')} ${escapeHtml(travelStyleText(tripData.travelStyle))} ${assistantText('editable_plan')}</p>
          </div>
           <div class="mb-6 grid grid-cols-3 gap-2 rounded-2xl bg-navy-900 p-3 text-white shadow-lg">
             <div class="border-l border-white/15 px-2 text-center"><span class="block text-[.66rem] text-white/60">${assistantText('destination')}</span><strong id="tripDestination" class="mt-1 block truncate text-sm text-gold-400">${escapeHtml(tripLabel())}</strong></div>
             <div class="border-l border-white/15 px-2 text-center"><span class="block text-[.66rem] text-white/60">${assistantText('days_count')}</span><strong id="tripDays" class="mt-1 block text-sm">${itinerary.length} ${assistantText('days')}</strong></div>
             <div class="px-2 text-center"><span class="block text-[.66rem] text-white/60">${assistantText('budget')}</span><strong id="tripBudget" class="mt-1 block truncate text-sm text-gold-400">${totalBudget ? `${totalBudget} ${escapeHtml(tripData.budget.currency || '')}` : assistantText('not_specified')}</strong></div>
          </div>
          ${renderHealthCard()}
           <div class="mb-3 mt-5 flex items-center justify-between"><h2 class="text-lg font-extrabold text-navy-900">${assistantText('day_by_day')}</h2></div>
          <div id="activitiesContainer" class="space-y-6"></div>
          <div id="smart-recs" class="mt-6"></div>
          <div class="mt-7 grid grid-cols-3 gap-2"><button id="share-trip" type="button" data-i18n="share_trip" class="min-h-12 rounded-xl bg-gold-500 px-3 py-3 text-xs font-bold text-navy-900 transition hover:bg-gold-600">${assistantText('share_trip')}</button><a href="./today.html" data-i18n="today_heading" class="flex min-h-12 items-center justify-center rounded-xl bg-navy-900 px-3 py-3 text-xs font-bold text-white transition hover:bg-navy-800">${assistantText('today_mode')}</a><a href="./create-trip.html" class="flex min-h-12 items-center justify-center rounded-xl border-2 border-navy-900 px-3 py-3 text-xs font-bold text-navy-900 transition hover:bg-navy-900 hover:text-white">${assistantText('edit_data')}</a></div><p id="share-status" class="mt-2 min-h-5 text-center text-xs text-slate-500"></p>
        </section>
        <nav data-site-nav data-active="trip"></nav>
        <div id="assistant-backdrop" class="assistant-backdrop" hidden></div>
        <button id="assistant-fab" class="assistant-fab" type="button" aria-label="${assistantText('assistant_title')}" title="${assistantText('assistant_title')}"><span class="assistant-fab-icon">🤖</span><span class="assistant-fab-label">${assistantText('assistant_title')}</span></button>
        <section id="assistant-sheet" class="assistant-sheet" role="dialog" aria-modal="true" aria-labelledby="assistant-title" hidden>
          <div class="assistant-grabber" aria-hidden="true"></div>
          <header class="assistant-head"><div><h2 id="assistant-title" data-i18n="assistant_title">${assistantText('assistant_title')}</h2><p data-i18n="assistant_subtitle">${assistantText('assistant_subtitle')}</p></div><button id="assistant-close" class="assistant-close" type="button" aria-label="${assistantText('close')}" data-i18n="close">×</button></header>
          <div id="assistant-context" class="assistant-context"></div>
          <div id="assistant-messages" class="assistant-messages" aria-live="polite"></div>
          <div class="assistant-quick" aria-label="${assistantText('quick_actions')}"><button type="button" data-assistant-prompt="${assistantText('assistant_salutation')}" data-i18n="assistant_salutation">${assistantText('assistant_salutation')}</button><button type="button" data-assistant-prompt="${assistantText('assistant_wellbeing')}" data-i18n="assistant_wellbeing">${assistantText('assistant_wellbeing')}</button><button type="button" data-assistant-prompt="${assistantText('assistant_today_prompt')}" data-i18n="assistant_today_prompt">${assistantText('assistant_today_prompt')}</button><button type="button" data-assistant-prompt="${assistantText('assistant_replace_request')}" data-i18n="assistant_replace_request">${assistantText('assistant_replace_request')}</button><button type="button" data-assistant-prompt="${assistantText('assistant_remove_request')}" data-i18n="assistant_remove_request">${assistantText('assistant_remove_request')}</button><button type="button" data-assistant-prompt="${assistantText('assistant_replan_request')}" data-i18n="assistant_replan_request">${assistantText('assistant_replan_request')}</button><button type="button" data-assistant-prompt="${assistantText('assistant_rain_request')}" data-i18n="assistant_rain_request">${assistantText('assistant_rain_request')}</button></div>
          <form id="assistant-form" class="assistant-form" novalidate><input id="assistant-input" type="text" autocomplete="off" placeholder="${assistantText('assistant_input')}" data-i18n-placeholder="assistant_input" aria-label="${assistantText('assistant_message')}" required><button type="submit" aria-label="${assistantText('assistant_send')}" data-i18n="assistant_send">➤</button></form>
        </section>
        <div id="assistant-toast" class="assistant-toast" role="status"></div>`;
      document.getElementById('tripHeaderImg').src = getCityImage(tripLabel());
      renderDayPlan(readLiveActivities());
      document.getElementById('share-trip')?.addEventListener('click', async () => { const status = document.getElementById('share-status'); const sharedTrip = { ...tripData, days: itinerary.length, activities: itinerary.flatMap((day) => day.activities || []) }; let ok = false; try { ok = await shareTrip(sharedTrip); } catch { ok = false; } if (ok) { status.textContent = assistantText('share_ready'); return; } const link = document.createElement('a'); link.href = buildTripLink(sharedTrip); link.target = '_blank'; link.rel = 'noopener'; link.textContent = assistantText('open_share_link'); status.replaceChildren(link); });
      wireAssistant();
    }

    function readLiveActivities() {
      const sources = [];
      try {
        const stateActivities = window.AppState?.getActivities?.() || [];
        sources.push(...stateActivities);
      } catch (error) {
      }
      return sources.filter((item, index, all) => item && all.findIndex((candidate) => (
        item.id && candidate.id && candidate.id === item.id
      )) === index);
    }

    function renderDayPlan(activities) {
      if (!tripData) return;
      if (Array.isArray(activities) && activities.length) {
        itinerary = itineraryFromActivities(activities, tripData);
      }
      const container = document.getElementById('activitiesContainer');
      if (!container) return;
      container.innerHTML = itinerary.map((day) => `<section><div class="mb-3 flex items-center gap-2"><span class="flex h-8 w-8 items-center justify-center rounded-xl bg-gold-500 text-sm font-extrabold text-white">${day.day}</span><h3 class="text-sm font-extrabold text-navy-900">${assistantText('day_label')} ${day.day}: <span class="font-semibold text-slate-500">${formatDate(day.date)}</span></h3></div><div class="space-y-3">${day.activities.map((activity, index) => renderActivity(activity, day.day - 1, index)).join('')}</div></section>`).join('');
      container.querySelectorAll('[data-add]').forEach((button) => button.addEventListener('click', () => {
        const [dayIndex, activityIndex] = button.dataset.add.split(':').map(Number);
        const activity = itinerary[dayIndex].activities[activityIndex];
        activity.added = true;
        // <!-- QA14-SYNC -->
        window.AppState?.addActivity({
          id: activity.id,
          name: activity.place,
          place: activity.place,
          description: activity.activity,
          type: assistantText('trip_activity_type'),
          distance: activity.distance,
          duration: activity.duration,
          cost: activity.cost,
          category: activity.category || 'activities',
          costEstimated: activity.costEstimated,
          currency: activity.currency,
          coords: activity.coords || null,
          time: activity.time,
          day_number: itinerary[dayIndex].day
        });
        saveItinerary();
        renderDayPlan(readLiveActivities());
      }));
      hydratePlaceImages();
      container.querySelectorAll('[data-edit]').forEach((button) => button.addEventListener('click', () => {
        const [dayIndex, activityIndex] = button.dataset.edit.split(':').map(Number);
        openEditor(dayIndex, activityIndex);
      }));
    }

     // <!-- QA15-SYNC: merge every saved activity source and keep the day assignment -->
     function readStoredItinerary() {
       try {
         return window.AppState?.getItinerary?.() || [];
       } catch (error) { return []; }
     }

     function collectSavedActivities(savedItinerary) {
       const sources = [
         ...(tripData.remoteActivities || []),
         ...(window.AppState?.getActivities?.() || [])
       ];
       savedItinerary.forEach((day) => (day.activities || []).forEach((activity) => {
         if (activity.added) sources.push({ ...activity, day_number: day.day });
       }));
       return sources.filter((item, index, all) => item && all.findIndex((candidate) => (
         item.id && candidate.id && candidate.id === item.id
       )) === index);
     }

     function rebuildItinerary() {
       if (!tripData) return;
       const savedItinerary = readStoredItinerary();
       const activities = collectSavedActivities(savedItinerary);
       itinerary = activities.length
         ? itineraryFromActivities(activities, tripData)
         : (savedItinerary.length ? savedItinerary : generateMockItinerary(tripData));
       saveItinerary();
       if (!app.classList.contains('hidden')) {
         render();
         renderDayPlan(readLiveActivities());
       }
     }

     window.addEventListener('storage', () => rebuildItinerary());
     window.addEventListener('pageshow', () => rebuildItinerary());
    window.addEventListener('appstate:activity-added', () => renderDayPlan(readLiveActivities()));

    function openEditor(dayIndex, activityIndex) {
      editing = { day: dayIndex, activity: activityIndex };
      const activity = itinerary[dayIndex].activities[activityIndex];
      document.getElementById('edit-time').value = activity.time;
      document.getElementById('edit-place').value = activity.place;
      document.getElementById('edit-activity').value = activity.activity;
      document.getElementById('edit-distance').value = activity.distance;
      document.getElementById('edit-duration').value = activity.duration;
      editDialog.showModal();
    }

    editForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const activity = itinerary[editing.day].activities[editing.activity];
      activity.time = document.getElementById('edit-time').value.trim();
      activity.place = document.getElementById('edit-place').value.trim();
      activity.activity = document.getElementById('edit-activity').value.trim();
      activity.distance = document.getElementById('edit-distance').value.trim();
      activity.duration = document.getElementById('edit-duration').value.trim();
      saveItinerary();
      editDialog.close();
      render();
    });
    document.getElementById('close-edit').addEventListener('click', () => editDialog.close());
    document.getElementById('cancel-edit').addEventListener('click', () => editDialog.close());

    loading.classList.add('hidden');
    aiLoadingScreen.classList.remove('hidden');
    window.setTimeout(async () => {
      tripData = await loadCurrentTrip();
      if (!tripData || !tripData.destination || !tripData.dates || !tripData.dates.start) {
        window.location.href = './create-trip.html';
        return;
      }
       rebuildItinerary();
      loading.classList.add('hidden');
      app.classList.remove('hidden');
      render();
      await backfillMissingCoords();
      try {
        let smartCoords = tripData && tripData.cityCoords;
        const smartOk = smartCoords && Number.isFinite(smartCoords.lat) && Number.isFinite(smartCoords.lng);
        if (!smartOk && window.MySindbadGeocode && tripData && tripData.destination) {
          const r = await window.MySindbadGeocode.geocodeActivity(tripData.destination, tripData.destination, null);
          if (r && Number.isFinite(r.lat) && Number.isFinite(r.lng)) smartCoords = { lat: r.lat, lng: r.lng };
        }
        if (smartCoords && Number.isFinite(smartCoords.lat) && Number.isFinite(smartCoords.lng)) {
          const m = await import("./js/msRecommend.js");
          m.renderSmartRecs(document.getElementById("smart-recs"), { coords: smartCoords, theme: "light" });
        }
      } catch (e) {}
      document.getElementById('aiLoadingScreen').classList.add('hidden');
    }, 2500);
  </script>
<script src="./utils/navigation.js"></script>
<script src="./utils/header.js"></script>
  <script src="./utils/icons.js" defer></script>
</body>
