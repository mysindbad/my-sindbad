<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Phase 12 Tests — Geocoding & Location — My Sindbad</title>
<style>
  body{font-family:ui-monospace,monospace;max-width:820px;margin:2rem auto;padding:0 1rem;line-height:1.6}
  h1{font-size:1.15rem}
  .summary{font-size:1.05rem;font-weight:700;margin:1rem 0;padding:.6rem .9rem;border-radius:8px}
  .summary.pass{background:#dcfce7;color:#166534}
  .summary.fail{background:#fee2e2;color:#991b1b}
  .group{margin:1.2rem 0 0;padding:.5rem .8rem;border-left:3px solid #cbd5e1;font-weight:700;font-size:.85rem}
  ul{list-style:none;padding:0}
  li{padding:.35rem .6rem;border-radius:6px;margin:.2rem 0;font-size:.8rem}
  li.ok{background:#f0fdf4;color:#166534}
  li.bad{background:#fef2f2;color:#991b1b}
  code{background:#f1f5f9;padding:.1rem .3rem;border-radius:3px;font-size:.76rem}
</style>
</head>
<body>
<h1>PHASE 12 — Geocoding &amp; Location Architecture Tests</h1>
<div id="summary" class="summary">Running…</div>
<div id="groups"></div>
<script src="./utils/geocode.js"></script>
<script src="./utils/msLocation.js"></script>
<script>
(function () {
  'use strict';

  // ---- Mock infrastructure ----
  let mockFetchImpl = null;
  const realFetch = window.fetch;
  window.fetch = function () {
    if (mockFetchImpl) return mockFetchImpl.apply(null, arguments);
    return realFetch.apply(null, arguments);
  };

  // Mock navigator.geolocation
  let mockGeo = null;
  try {
    Object.defineProperty(navigator, 'geolocation', { configurable: true, get: () => mockGeo });
  } catch (e) {
    // If we can't override, location tests will use real geolocation (UNSUPPORTED test may differ).
  }
  function setMockGeo(impl) { mockGeo = impl; }
  function clearMockGeo() { mockGeo = null; }

  // ---- Test harness ----
  const allResults = [];
  const groups = [];
  function group(name) { groups.push({ name, results: [] }); }
  function assert(name, ok, detail) {
    const r = { name: name, ok: !!ok, detail: detail || '' };
    allResults.push(r);
    if (groups.length) groups[groups.length - 1].results.push(r);
  }
  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
  function clearCache() { try { localStorage.removeItem('mysindbad:geocode-cache:v2'); } catch (e) {} }

  // ---- GEOCODE TESTS ----
  async function geocodeTests() {
    group('Geocoding');
    clearCache();

    // 1. valid coordinates normalized to canonical shape
    let fetchCount = 0;
    mockFetchImpl = async () => { fetchCount++; return { ok: true, json: async () => [{ lat: '31.6', lon: '-7.9', display_name: 'Marrakech, Morocco', type: 'city', name: 'Marrakech' }] }; };
    const r1 = await window.MySindbadGeocode.geocode('marrakech');
    assert('valid coords normalized', r1 && r1.coordinates && r1.coordinates.lat === 31.6 && r1.coordinates.lng === -7.9, JSON.stringify(r1 && r1.coordinates));
    assert('source is nominatim', r1 && r1.source === 'nominatim', r1 && r1.source);
    assert('name extracted', r1 && r1.name === 'Marrakech', r1 && r1.name);

    // 2. cache hit avoids network
    const countAfterFirst = fetchCount;
    const r2 = await window.MySindbadGeocode.geocode('marrakech');
    assert('cache hit avoids network', fetchCount === countAfterFirst, 'fetch: ' + fetchCount + ' vs ' + countAfterFirst);
    assert('cache returns source=cache', r2 && r2.source === 'cache', r2 && r2.source);

    // 3. same query deduplicates (in-flight)
    clearCache();
    fetchCount = 0;
    mockFetchImpl = async () => { fetchCount++; await delay(120); return { ok: true, json: async () => [{ lat: '31.6', lon: '-7.9', display_name: 'X', type: 'city' }] }; };
    const p1 = window.MySindbadGeocode.geocode('dedup test query');
    const p2 = window.MySindbadGeocode.geocode('dedup test query');
    await Promise.all([p1, p2]);
    assert('same query deduplicates', fetchCount === 1, 'fetch count: ' + fetchCount);

    // 4. invalid result rejected
    clearCache();
    mockFetchImpl = async () => ({ ok: true, json: async () => [{ lat: 'abc', lon: 'xyz' }] });
    const r4 = await window.MySindbadGeocode.geocode('invalid coords test');
    assert('invalid result rejected', r4 === null, JSON.stringify(r4));

    // 5. provider failure doesn't crash (returns null)
    clearCache();
    mockFetchImpl = async () => { throw new Error('network down'); };
    const r5 = await window.MySindbadGeocode.geocode('network failure test');
    assert('provider failure returns null', r5 === null, JSON.stringify(r5));

    // 6. timeout works (fetch aborts → null)
    clearCache();
    mockFetchImpl = (url, init) => new Promise((resolve, reject) => {
      const t = setTimeout(() => resolve({ ok: true, json: async () => [] }), 30000);
      if (init && init.signal) init.signal.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('aborted', 'AbortError')); });
    });
    const r6 = await window.MySindbadGeocode.geocode('timeout test query', { timeout: 300 });
    assert('timeout returns null', r6 === null, JSON.stringify(r6));

    // 7. queue respects delay (MIN_INTERVAL enforced)
    assert('queue + MIN_INTERVAL configured', window.MySindbadGeocode._constants.MIN_INTERVAL >= 200, String(window.MySindbadGeocode._constants.MIN_INTERVAL));

    // 8. empty query returns null
    const r8 = await window.MySindbadGeocode.geocode('');
    assert('empty query returns null', r8 === null, JSON.stringify(r8));

    // 9. geocodeActivity returns canonical shape
    clearCache();
    mockFetchImpl = async () => ({ ok: true, json: async () => [{ lat: '31.63', lon: '-7.98', display_name: 'Jemaa el-Fnaa, Marrakech', type: 'attraction' }] });
    const r9 = await window.MySindbadGeocode.geocodeActivity('Jemaa el-Fnaa', 'Marrakech', { lat: 31.63, lng: -7.98 });
    assert('geocodeActivity canonical shape', r9 && r9.coordinates && r9.coordinates.lat === 31.63, JSON.stringify(r9 && r9.coordinates));

    // 10. geocodeActivity rejects far result (safety check)
    clearCache();
    mockFetchImpl = async () => ({ ok: true, json: async () => [{ lat: '48.85', lon: '2.35', display_name: 'Paris', type: 'city' }] });
    const r10 = await window.MySindbadGeocode.geocodeActivity('test', 'Marrakech', { lat: 31.63, lng: -7.98 });
    assert('geocodeActivity rejects far result', r10 === null, JSON.stringify(r10));

    mockFetchImpl = null;
  }

  // ---- LOCATION TESTS ----
  async function locationTests() {
    group('Location');

    // 1. UNSUPPORTED (no geolocation)
    clearMockGeo();
    try { await window.MSLocation.current(); assert('UNSUPPORTED rejected', false, 'should reject'); }
    catch (e) { assert('UNSUPPORTED rejected', e.type === 'UNSUPPORTED', e.type); }

    // 2. DENIED
    setMockGeo({ getCurrentPosition: (ok, err) => err({ code: 1, message: 'denied' }), watchPosition: () => 0, clearWatch: () => {} });
    try { await window.MSLocation.current(); assert('DENIED rejected', false, 'should reject'); }
    catch (e) { assert('DENIED rejected', e.type === 'DENIED', e.type); }

    // 3. UNAVAILABLE
    setMockGeo({ getCurrentPosition: (ok, err) => err({ code: 2, message: 'unavailable' }), watchPosition: () => 0, clearWatch: () => {} });
    try { await window.MSLocation.current(); assert('UNAVAILABLE rejected', false, 'should reject'); }
    catch (e) { assert('UNAVAILABLE rejected', e.type === 'UNAVAILABLE', e.type); }

    // 4. TIMEOUT
    setMockGeo({ getCurrentPosition: (ok, err) => err({ code: 3, message: 'timeout' }), watchPosition: () => 0, clearWatch: () => {} });
    try { await window.MSLocation.current(); assert('TIMEOUT rejected', false, 'should reject'); }
    catch (e) { assert('TIMEOUT rejected', e.type === 'TIMEOUT', e.type); }

    // 5. valid position resolves
    setMockGeo({ getCurrentPosition: (ok) => ok({ coords: { latitude: 31.6, longitude: -7.9, accuracy: 10 }, timestamp: 1 }), watchPosition: () => 0, clearWatch: () => {} });
    const pos = await window.MSLocation.current();
    assert('valid position resolves', pos && pos.lat === 31.6 && pos.lng === -7.9, JSON.stringify(pos));

    // 6. default enableHighAccuracy is false (non-navigation)
    let capturedOpts = null;
    setMockGeo({ getCurrentPosition: (ok, err, o) => { capturedOpts = o; ok({ coords: { latitude: 1, longitude: 2, accuracy: 1 }, timestamp: 1 }); }, watchPosition: () => 0, clearWatch: () => {} });
    await window.MSLocation.current();
    assert('default enableHighAccuracy=false', capturedOpts && capturedOpts.enableHighAccuracy === false, JSON.stringify(capturedOpts));

    // 7. watch + stop cleanup + no duplicate watchers
    let watchSeq = 0;
    const clearedIds = [];
    setMockGeo({
      getCurrentPosition: () => {},
      watchPosition: () => { watchSeq++; return watchSeq; },
      clearWatch: (id) => { clearedIds.push(id); }
    });
    window.MSLocation.stop(); // ensure clean state
    const stop1 = window.MSLocation.watch(() => {});
    const stop2 = window.MSLocation.watch(() => {}); // should stop first
    assert('duplicate watch stops first', clearedIds.length === 1 && clearedIds[0] === 1, 'cleared: ' + JSON.stringify(clearedIds));
    stop2();
    assert('stop() cleanup clears watch', clearedIds.length === 2 && clearedIds[1] === 2, 'cleared: ' + JSON.stringify(clearedIds));
    stop2(); // idempotent
    assert('stop() idempotent', clearedIds.length === 2, 'cleared: ' + JSON.stringify(clearedIds));
    window.MSLocation.stop();

    // 8. permissionState unsupported when no geolocation
    clearMockGeo();
    const ps = await window.MSLocation.permissionState();
    assert('permissionState unsupported', ps === 'unsupported', ps);

    clearMockGeo();
  }

  // ---- MAP LOGIC TESTS ----
  async function mapTests() {
    group('Map');

    // 1. existing coords don't trigger geocode (validCoords detects them)
    const hasCoords = window.MySindbadGeocode.validCoords({ coordinates: { lat: 31.6, lng: -7.9 } });
    assert('validCoords detects existing coords', hasCoords !== null, JSON.stringify(hasCoords));

    const legacyLatLon = window.MySindbadGeocode.validCoords({ lat: 31.6, lon: -7.9 });
    assert('validCoords reads legacy {lat,lon}', legacyLatLon !== null, JSON.stringify(legacyLatLon));

    const noCoords = window.MySindbadGeocode.validCoords({ name: 'test' });
    assert('validCoords rejects missing coords', noCoords === null, JSON.stringify(noCoords));

    // 2. backfill uses requestIdleCallback (architecture verified in map.html)
    assert('requestIdleCallback available', typeof window.requestIdleCallback === 'function' || typeof window.requestIdleCallback === 'object', typeof window.requestIdleCallback);

    // 3. cache versioned key (v2)
    assert('cache key versioned v2', window.MySindbadGeocode._constants.CACHE_KEY === 'mysindbad:geocode-cache:v2', window.MySindbadGeocode._constants.CACHE_KEY);
  }

  // ---- RUN ----
  (async () => {
    await geocodeTests();
    await locationTests();
    await mapTests();

    const passed = allResults.filter(r => r.ok).length;
    const failed = allResults.length - passed;
    const summary = document.getElementById('summary');
    summary.textContent = passed + '/' + allResults.length + ' passed · ' + failed + ' failed';
    summary.className = 'summary ' + (failed === 0 ? 'pass' : 'fail');

    const container = document.getElementById('groups');
    container.innerHTML = groups.map(g => {
      const gp = g.results.filter(r => r.ok).length;
      return '<div class="group">' + g.name + ' (' + gp + '/' + g.results.length + ')</div><ul>' +
        g.results.map(r => '<li class="' + (r.ok ? 'ok' : 'bad') + '">' + (r.ok ? '✓' : '✗') + ' ' + r.name + (r.detail ? ' — <code>' + r.detail + '</code>' : '') + '</li>').join('') +
        '</ul>';
    }).join('');
  })();
})();
</script>
</body>
</html>
