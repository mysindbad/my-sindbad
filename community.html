*{box-sizing:border-box;font-family:Cairo,system-ui,sans-serif}body{margin:0;min-height:100vh;background:#060e1a;color:#0c1624}.shell{width:100%;max-width:480px;min-height:100vh;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 0 60px #0005}.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;min-height:76px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:#0a192ff7;color:#fff;border-bottom:1px solid #d4af374d;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.brand img{width:44px;height:44px;border-radius:14px;object-fit:cover;border:1px solid #d4af3770}.brand strong{display:block;color:var(--gold);font:700 1.18rem 'Playfair Display',Georgia,serif}.brand small{display:block;color:#fffb;font-size:.64rem}.home-link{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid #ffffff33;border-radius:12px;color:#fff;text-decoration:none;font-size:.72rem;font-weight:700}.content{padding:18px}.intro p{margin:0;color:var(--gold-dark);font-size:.68rem;font-weight:800}.intro h1{margin:4px 0 5px;color:var(--navy);font-size:1.38rem;font-weight:800}.intro span{display:block;margin-bottom:18px;color:var(--muted);font-size:.73rem;line-height:1.8}.feed{display:grid;gap:16px}.post{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 22px #0b1b5110}.post-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 11px}.traveler{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border:2px solid var(--gold);border-radius:50%;object-fit:cover;background:#fffaf0}.traveler strong{display:block;color:var(--navy);font-size:.73rem}.traveler small{display:block;color:var(--muted);font-size:.6rem}.more{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-size:1.15rem}.more:hover{background:#f6f8fb;color:var(--navy)}.post-image{display:block;width:100%;height:260px;object-fit:cover;background:#e9eef4}.post-body{padding:12px 14px 14px}.actions{display:flex;align-items:center;gap:4px;margin-bottom:10px}.action{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:42px;min-height:44px;padding:0 8px;border:0;border-radius:11px;background:transparent;color:var(--muted);cursor:pointer;font-size:.7rem;font-weight:700}.action:hover,.action.active{color:var(--gold-dark);background:#fffaf0}.action.share{margin-right:auto}.location{margin:0 0 5px;color:var(--navy);font-size:.75rem;font-weight:800}.description{margin:0;color:#334155;font-size:.73rem;line-height:1.9}.comments{display:none;margin-top:11px;padding-top:10px;border-top:1px solid #f1f4f8}.comments.show{display:block}.comment-form{display:flex;gap:6px}.comment-form input{width:100%;min-height:42px;padding:0 10px;border:1px solid var(--line);border-radius:10px;outline:none;font-size:.68rem}.comment-form input:focus{border-color:var(--gold)}.comment-form button{min-width:48px;border:0;border-radius:10px;color:var(--navy);background:var(--gold);cursor:pointer;font-weight:800}.comment-list{margin:8px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.66rem;line-height:1.8}.add-trip{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:13px;border:0;border-radius:13px;color:var(--navy);background:var(--gold);cursor:pointer;font-size:.76rem;font-weight:800;box-shadow:0 5px 12px #d4af3730}.add-trip:hover{background:#e2bd42}.add-trip.added{color:#166534;background:#dcfce7;box-shadow:none}.toast{position:fixed;right:50%;bottom:94px;z-index:50;display:none;transform:translateX(50%);max-width:calc(100% - 32px);padding:11px 16px;border-radius:12px;color:#fff;background:var(--navy);box-shadow:0 8px 22px #0004;font-size:.72rem;font-weight:700;text-align:center;backdrop-filter:blur(14px)}.toast.show{display:block;animation:toast .25s ease both}@keyframes toast{from{opacity:0;transform:translate(50%,8px)}to{opacity:1;transform:translate(50%,0)}}.empty{padding:24px;text-align:center;border:1px dashed #cbd5e1;border-radius:16px;color:var(--muted);background:#fff;font-size:.72rem;line-height:1.8}.nav{position:fixed;bottom:0;left:50%;z-index:30;display:flex;width:100%;max-width:480px;transform:translateX(-50%);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0a192ff7;border-top:1px solid #fff2;box-shadow:0 -4px 18px #0003;backdrop-filter:blur(14px)}.nav a{display:flex;min-height:52px;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;color:#fffa;text-decoration:none;font-size:.55rem}.nav a.active{color:var(--gold);background:#d4af3729;font-weight:800}@media(min-width:700px){body{padding:22px 0}.shell{min-height:calc(100vh - 44px);border-radius:28px;overflow:hidden}.nav{position:absolute;border-radius:0 0 28px 28px}}
 .add-trip{width:auto;min-height:42px;margin-top:13px;padding:0 18px;border-radius:10px;font-size:.7rem}
 .post-image.image-fallback{object-fit:contain;background:linear-gradient(135deg,#0A192F,#D4AF37);color:#fff;font-weight:800}
 
.compose-btn{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateX(180px);z-index:25;width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(135deg,#D4AF37,#b8941f);color:#0A192F;font-size:1.6rem;font-weight:800;box-shadow:0 8px 22px rgba(212,175,55,.45);display:grid;place-items:center;cursor:pointer;line-height:1}
.compose-btn:active{transform:translateX(-50%) translateX(180px) scale(.94)}
.compose-modal{position:fixed;inset:0;z-index:60;display:none;background:#0009;backdrop-filter:blur(4px)}
.compose-modal.show{display:block}
.compose-sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #0003;animation:sheetUp .25s ease both}
@keyframes sheetUp{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.compose-sheet h3{margin:0 0 4px;color:#0A192F;font-size:1.05rem;font-weight:800}
.compose-sheet p{margin:0 0 14px;color:#64748b;font-size:.72rem;line-height:1.6}
.compose-field{width:100%;min-height:46px;margin-bottom:10px;padding:0 12px;border:1px solid #e8ecf2;border-radius:12px;font-size:.78rem;color:#0c1624;background:#fff;font-family:inherit}
.compose-field:focus{outline:none;border-color:#D4AF37}
textarea.compose-field{min-height:90px;padding:10px 12px;resize:vertical;line-height:1.6}
.compose-actions{display:flex;gap:8px;margin-top:6px}
.compose-actions button{flex:1;min-height:48px;border:0;border-radius:13px;font-size:.8rem;font-weight:800;cursor:pointer;font-family:inherit}
.compose-actions .publish{background:#D4AF37;color:#0A192F}
.compose-actions .cancel{background:#f1f4f8;color:#64748b}
</style>
<script>(function(){try{var p=localStorage.getItem('themePreference')||'auto',h=new Date().getHours(),d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches,night=h>=19||h<6;document.documentElement.dataset.themePreference=p;document.documentElement.dataset.theme=(p==='dark'||(p==='auto'&&(night||d)))?'dark':'light';}catch(e){document.documentElement.dataset.theme='light';}})();</script>

<body>
<main class="shell">
<div data-site-header=""></div>
<section class="content"><div class="intro"><p data-i18n="community_kicker">MY SINDBAD · مجتمع المسافرين</p><h1 data-i18n="travel_inspiration">إلهام من رحلات حقيقية</h1><span data-i18n="community_intro">اكتشف أماكن جديدة من تجارب مسافرين مثلك، وأضفها إلى رحلتك بضغطة واحدة.</span></div><section aria-live="polite" class="feed" id="feed"></section></section>
<nav data-active="community" data-site-nav=""></nav>

<button class="compose-btn" id="composeOpen" type="button" aria-label="share your trip" title="">＋</button>
<div class="compose-modal" id="composeModal" role="dialog" aria-modal="true"><div class="compose-sheet"><h3 data-i18n="share_your_trip">شارك رحلتك مع المجتمع</h3><p data-i18n="composer_image_hint">الصق رابط صورة أو اتركه فارغاً لاستخدام صورة افتراضية</p><form id="composeForm"><input class="compose-field" id="composeDestination" type="text" required><textarea class="compose-field" id="composeDescription" required></textarea><input class="compose-field" id="composeImage" type="url"><div class="compose-actions"><button class="cancel" type="button" id="composeClose" data-i18n="composer_cancel">إلغاء</button><button class="publish" type="submit" data-i18n="composer_publish">نشر</button></div></form></div></div>
</main><div aria-live="polite" class="toast" id="toast" role="status"></div>
<script src="./utils/appState.js"></script>
<script>
function generateMockPosts(){return[
  {id:1,user:{name:'أحمد المسافر',avatar:'https://i.pravatar.cc/96?img=12'},image:'https://image.qwenlm.ai/public_source/e519404d-4d50-460e-a07e-5e2fe0b81811/87cd0db02-30ad-437f-9eec-3aa3c0dcbdf49390.png',location:'مراكش، المغرب',description:'تجربة لا تُنسى بين ألوان المدينة القديمة وروائح التوابل. لا تفوّت غروب الشمس من سطح أحد الرياضات.',likes:124,isLiked:false,isSaved:false},
  // <!-- QA14-IMG -->
  {id:2,user:{name:'سارة حول العالم',avatar:'https://i.pravatar.cc/96?img=47'},image:'https://image.qwenlm.ai/public_source/e519404d-4d50-460e-a07e-5e2fe0b81811/5a74e70c6-0b49-4321-9579-b1ec180e57da4916.png',location:'شفشاون، المغرب',description:'الشوارع الزرقاء هادئة والطعام رائع. المكان مثالي للمشي البطيء والتقاط صور لا تنتهي.',likes:89,isLiked:false,isSaved:false},
 {id:3,user:{name:'يوسف الرحّال',avatar:'https://i.pravatar.cc/96?img=68'},image:'https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?w=600',location:'إسطنبول، تركيا',description:'من البازار الكبير إلى مضيق البوسفور، يوم واحد هنا كافٍ لتشعر أنك عشت أكثر من رحلة.',likes:176,isLiked:false,isSaved:false},
 {id:4,user:{name:'ليلى تكتشف',avatar:'https://i.pravatar.cc/96?img=32'},image:'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=600',location:'باريس، فرنسا',description:'صباح هادئ قرب نهر السين، وقهوة صغيرة قبل جولة طويلة في الأزقة القديمة.',likes:143,isLiked:false,isSaved:false}
]}
const readLocal=(key,fallback)=>{try{const value=localStorage.getItem(key);return value===null?fallback:JSON.parse(value)}catch(error){return fallback}};
const writeLocal=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value));return true}catch(error){return false}};
const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const t=(key,fallback='')=>window.MySindbadI18n?.getTranslation?.(window.MySindbadI18n?.getLang?.()||'ar',key)||fallback;
const userPosts=readLocal('communityUserPosts',[]);const posts=[...userPosts,...generateMockPosts()],savedState=readLocal('communityPostState',{}),commentsState=readLocal('communityComments',{}),toast=document.getElementById('toast');let toastTimer;
posts.forEach((post)=>{const state=savedState[post.id];if(state){post.likes=Number.isFinite(state.likes)?state.likes:post.likes;post.isLiked=Boolean(state.isLiked);post.isSaved=Boolean(state.isSaved)}});
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
function persistPost(post){savedState[post.id]={likes:post.likes,isLiked:post.isLiked,isSaved:post.isSaved};writeLocal('communityPostState',savedState)}
function defaultImageFor(location){const city=(location||'').toLowerCase();const map=[['مراكش','marrakech'],['marrakech','marrakech'],['شفشاون','chefchaouen'],['chefchaouen','chefchaouen'],['إسطنبول','istanbul'],['istanbul','istanbul'],['باريس','paris'],['paris','paris'],['فاس','fes'],['fes','fes'],['تونس','tunis'],['تangier','tangier'],['طنجة','tangier']];for(const [k,v] of map){if(city.includes(k))return './images/'+v+'.jpg'}return 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=600'}
function initComposer(){const open=document.getElementById('composeOpen');const modal=document.getElementById('composeModal');const close=document.getElementById('composeClose');const form=document.getElementById('composeForm');if(!open||!modal||!form)return;const d=document.getElementById('composeDestination'),de=document.getElementById('composeDescription'),im=document.getElementById('composeImage');d.placeholder=t('composer_destination');de.placeholder=t('composer_description');im.placeholder=t('composer_image_url');open.title=t('share_your_trip');open.addEventListener('click',async()=>{const user=await window.Auth?.getCurrentUser?.();if(!user){showToast(t('login_to_post'));setTimeout(()=>{window.location.href='./login.html'},900);return}modal.classList.add('show')});close.addEventListener('click',()=>modal.classList.remove('show'));modal.addEventListener('click',(e)=>{if(e.target===modal)modal.classList.remove('show')});form.addEventListener('submit',(e)=>{e.preventDefault();submitPost()})}
async function submitPost(){const form=document.getElementById('composeForm');const destination=(document.getElementById('composeDestination').value||'').trim();const description=(document.getElementById('composeDescription').value||'').trim();const image=(document.getElementById('composeImage').value||'').trim();if(!destination||!description){showToast(t('post_publish_failed'));return}const user=await window.Auth?.getCurrentUser?.();if(!user){showToast(t('login_to_post'));return}const post={id:Date.now(),user:{name:(user.user_metadata&&user.user_metadata.full_name)||(user.email?user.email.split('@')[0]:t('traveler_from_community')),avatar:(user.user_metadata&&user.user_metadata.avatar_url)||('https://i.pravatar.cc/96?u='+encodeURIComponent(user.id))},image:image||defaultImageFor(destination),location:destination,description:description,likes:0,isLiked:false,isSaved:false,created_at:new Date().toISOString(),isUserPost:true};posts.unshift(post);const updated=[post,...readLocal('communityUserPosts',[])];writeLocal('communityUserPosts',updated);try{if(window.supabaseClient){const ins={id:String(post.id),author_id:user.id,author_name:post.user.name,author_avatar:post.user.avatar,location:post.location,description:post.description,image:post.image};const r=await window.supabaseClient.from('community_posts').insert(ins);if(r&&r.error)console.warn('Supabase community insert failed:',r.error.message)}}catch(e){console.warn(e)}form.reset();document.getElementById('composeModal').classList.remove('show');showToast(t('post_published'));render();bind()}
async function loadRemotePosts(){try{if(!window.supabaseClient)return;const {data,error}=await window.supabaseClient.from('community_posts').select('*').order('created_at',{ascending:false}).limit(50);if(error||!Array.isArray(data)||!data.length)return;const existing=new Set(posts.map(p=>String(p.id)));const remote=data.filter(r=>!existing.has(String(r.id))).map(r=>({id:Number(r.id)||Date.now(),user:{name:r.author_name||t('traveler_from_community'),avatar:r.author_avatar||('https://i.pravatar.cc/96?u='+encodeURIComponent(r.author_id||r.id))},image:r.image||defaultImageFor(r.location),location:r.location||'',description:r.description||'',likes:r.likes||0,isLiked:false,isSaved:false}));if(remote.length){posts.unshift(...remote);render();bind()}}catch(e){console.warn(e)}}
  function render(){const feed=document.getElementById('feed');if(!posts.length){feed.innerHTML=`<div class="empty">${t('no_posts_now')}</div>`;return}feed.innerHTML=posts.map((post)=>{const comments=Array.isArray(commentsState[post.id])?commentsState[post.id]:[];return `<article class="post" data-post="${post.id}"><header class="post-head"><div class="traveler"><img class="avatar" src="${escapeHtml(post.user.avatar)}" alt="${t('trip_image')} ${escapeHtml(post.user.name)}" loading="lazy" onerror="this.style.visibility='hidden'"><div><strong>${escapeHtml(post.user.name)}</strong><small>${t('traveler_from_community')}</small></div></div><button class="more" data-action="report" aria-label="${t('report_post')}" title="${t('report')}">⋯</button></header><img class="post-image" src="${escapeHtml(post.image)}" alt="${escapeHtml(post.location)}" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('image-fallback');this.parentElement.dataset.city='${escapeHtml(post.location)}'"><div class="post-body"><div class="actions"><button class="action ${post.isLiked?'active':''}" data-action="like">${post.isLiked?'♥':'♡'} <span>${post.likes}</span></button><button class="action" data-action="comment">💬 <span>${comments.length||''}</span></button><button class="action share" data-action="share">📤 ${t('share')}</button><button class="action ${post.isSaved?'active':''}" data-action="save">${post.isSaved?'🔖':'▫'} ${t('save')}</button></div><p class="location">📍 ${escapeHtml(post.location)}</p><p class="description">${escapeHtml(post.description)}</p><div class="comments" data-comments><form class="comment-form"><input maxlength="160" placeholder="${t('comment_placeholder')}" aria-label="${t('comment_label')}"><button type="submit">${t('send')}</button></form><ul class="comment-list">${comments.map((comment)=>`<li>${escapeHtml(comment)}</li>`).join('')}</ul></div><button class="add-trip" data-action="add">${t('add_place_to_trip')}</button></div></article>`}).join('')}
function openCreateTrip(){showToast(t('create_trip_first'));setTimeout(()=>{window.location.href='./create-trip.html'},900)}
 function addToTrip(post,button){const current=window.AppState?.getTrip?.();if(!current||typeof current!=='object'){openCreateTrip();return}const id=`community-${post.id}`;const existing=(window.AppState?.getActivities?.()||[]).some((item)=>item&&item.id===id);if(!existing)window.AppState?.addActivity?.({id,title:post.location,place:post.location,type:t('suggested_community_activity'),description:post.description,day_number:1,addedAt:new Date().toISOString()});button.textContent='✓ '+t('activity_added_trip');button.classList.add('added');button.disabled=true;showToast(t('place_added'))}
function bind(){document.querySelectorAll('[data-post]').forEach((card)=>{const id=Number(card.dataset.post),post=posts.find((item)=>item.id===id);card.querySelectorAll('[data-action]').forEach((button)=>button.addEventListener('click',async()=>{const action=button.dataset.action;if(action==='like'){post.isLiked=!post.isLiked;post.likes=Math.max(0,post.likes+(post.isLiked?1:-1));persistPost(post);render();return}if(action==='save'){post.isSaved=!post.isSaved;persistPost(post);render();showToast(post.isSaved?t('post_saved'):t('post_unsaved'));return}if(action==='comment'){card.querySelector('[data-comments]').classList.toggle('show');return}if(action==='report'){showToast(t('report_thanks'));return}if(action==='share'){const url=window.location.href.split('#')[0]+'#post-'+post.id;try{if(navigator.share)await navigator.share({title:`${post.location} — My Sindbad`,text:post.description,url});else if(navigator.clipboard)await navigator.clipboard.writeText(url);showToast(navigator.share?t('post_shared'):t('link_copied'))}catch(error){if(error.name!=='AbortError')showToast(t('share_failed'))}return}if(action==='add')addToTrip(post,button)}));const form=card.querySelector('.comment-form');form.addEventListener('submit',(event)=>{event.preventDefault();const input=form.querySelector('input'),value=input.value.trim();if(!value)return;commentsState[id]=Array.isArray(commentsState[id])?commentsState[id]:[];commentsState[id].push(value);writeLocal('communityComments',commentsState);render();const next=document.querySelector(`[data-post="${id}"] [data-comments]`);if(next)next.classList.add('show');showToast(t('comment_added'))})})}
 document.addEventListener('error',(event)=>{if(event.target.classList?.contains('post-image')){event.target.classList.add('image-fallback');event.target.alt=event.target.alt||t('trip_image');}},true);render();bind();initComposer();loadRemotePosts();
</script>
