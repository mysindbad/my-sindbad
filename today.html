<!DOCTYPE html>
<html data-i18n-title="title_today" dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>وضع اليوم - سندباد</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="./utils/cityImages.js"></script>
<link href="./utils/navigation.css" rel="stylesheet"/>
<link href="./utils/header.css" rel="stylesheet"/>
<script src="./utils/i18n.js?m6=final1" type="module"></script>
<script>(function(){try{var p=localStorage.getItem('themePreference')||'auto',h=new Date().getHours(),d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches,night=h>=19||h<6;document.documentElement.dataset.themePreference=p;document.documentElement.dataset.theme=(p==='dark'||(p==='auto'&&(night||d)))?'dark':'light';}catch(e){document.documentElement.dataset.theme='light';}})();</script>
<link href="./theme.css" rel="stylesheet"/>
<script defer="" src="./theme.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 pb-20">
<div class="max-w-md mx-auto p-4 space-y-4">
<!-- Empty state (no active trip) -->
<div id="empty-state" class="hidden" style="text-align:center;padding:3rem 1.2rem">
  <div style="width:64px;height:64px;margin:0 auto 1rem;border-radius:50%;display:grid;place-items:center;background:var(--gold-light);color:var(--accent-gold);font-size:1.8rem">🧭</div>
  <h3 data-i18n="today_empty_title" style="font-size:1.15rem;font-weight:700;color:var(--color);margin:0 0 .4rem">ابدأ رحلتك أولاً</h3>
  <p data-i18n="today_empty_text" style="font-size:.88rem;color:var(--text-muted);line-height:1.6;margin:0 0 1.3rem">ما عندك حتى الآن رحلة نشيطة. أنشئ رحلة باش تستافد من وضع اليوم، التوصيات الذكية، والملاحة.</p>
  <div style="display:flex;flex-direction:column;gap:.6rem">
    <a href="./create-trip.html" class="ms-btn ms-btn--block" data-i18n="create_trip">إنشاء رحلة</a>
    <a href="./explore.html" class="ms-btn ms-btn--ghost ms-btn--block" data-i18n="explore_places">استكشف الأماكن</a>
  </div>
</div>

<!-- Main content (has active trip) -->
<div id="main-content" class="hidden">
<!-- Header Weather -->
<header class="bg-gradient-to-r from-amber-500 to-amber-600 rounded-2xl p-4 text-white shadow-lg flex justify-between items-center">
<div>
<h1 class="text-xl font-black" data-i18n="today_heading">وضع اليوم 📍</h1>
<p class="text-sm font-bold text-white" data-i18n="destination_default" id="today-city">وجهتك</p>
<p class="text-xs text-amber-100" data-i18n="date_loading" id="today-date">جاري التحميل...</p>
</div>
<div class="text-left text-xs bg-white/20 p-2 rounded-xl backdrop-blur-sm" id="weather-box">
<span id="weather-temp">--°C</span> • <span data-i18n="weather_sunny" id="weather-desc">مشمس</span>
</div>
</header>
<!-- Progress Bar -->
<div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-2">
<div class="flex justify-between text-xs font-bold text-slate-600">
<span data-i18n="progress_today">تقدم اليوم</span>
<span id="progress-percent">0%</span>
</div>
<div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
<div class="bg-amber-500 h-full w-0 transition-all duration-500" id="progress-bar"></div>
</div>
</div>
<!-- Active & Next Cards -->
<div class="space-y-3">
<h2 class="text-sm font-bold text-slate-500" data-i18n="today_activity">النشاط الحالي</h2>
<div class="bg-white p-5 rounded-2xl border-2 border-amber-400 shadow-md" id="current-card">
<div class="text-lg font-black text-slate-800" data-i18n="no_today_activity" id="current-title">لا أنشطة لهذا اليوم</div>
<p class="text-xs text-slate-400 mb-4" id="current-time">--:--</p>
<button class="hidden w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl shadow transition" data-i18n="arrived" id="btn-arrived">وصلت ✓</button><button class="hidden w-full font-bold py-3 rounded-xl shadow transition mt-2" style="background:#0A192F;color:#D4AF37" data-i18n="start_navigation" id="btn-navigate">ابدأ الملاحة 🧭</button><button class="hidden w-full bg-white border-2 border-amber-400 text-amber-700 font-bold py-3 rounded-xl shadow transition mt-2" data-i18n="show_on_map" id="btn-map">إظهار على الخريطة 🗺️</button><a class="hidden bg-white border-2 border-amber-400 text-amber-700 font-bold py-3 rounded-xl shadow transition mt-2" data-i18n="details_label" id="btn-details" href="#">تفاصيل</a>
</div>
</div>
<!-- Smart Recommendations -->
<div class="space-y-3" id="smart-recs"></div>
<!-- Banner Alerts Container -->
<div id="alerts-container"></div>
</div>
</div>
<script src="./utils/appState.js"></script>
<script type="module">
    import { evaluateAlerts } from './utils/proactive.js';
    import { evaluateHealth } from './utils/health.js';
    import { renderSmartRecs } from './js/msRecommend.js';

    const trip = window.AppState?.getTrip?.() || {};
    const hasTrip = !!(trip && trip.destination && trip.dates && trip.dates.start);

    if (!hasTrip) {
      document.getElementById('empty-state').classList.remove('hidden');
      document.getElementById('main-content').classList.add('hidden');
    } else {
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('main-content').classList.remove('hidden');
      const lang = () => window.MySindbadI18n?.getLang?.() || localStorage.getItem('userLang') || 'ar';
      const t = (key, fallback = '') => window.MySindbadI18n?.getTranslation?.(lang(), key) || fallback;
      const normalized = window.MySindbadCity?.normalizeCityName(trip.destinationDisplay || trip.destination || trip.destinationName || trip.city || t('city_marrakech')) || { display: trip.destination || t('city_marrakech') };
      const destinationDisplay = normalized.display || t('city_marrakech');
      document.getElementById('today-city').textContent = destinationDisplay;
      document.getElementById('today-date').textContent = new Date().toLocaleDateString(lang() === 'fr' ? 'fr-FR' : lang() === 'en' ? 'en-US' : 'ar-MA', { weekday: 'long', month: 'short', day: 'numeric' });
      const cityCoords = trip.cityCoords || { lat: 31.6295, lng: -7.9811 };
      const weatherText = (code) => code === 0 ? t('weather_sunny') : code < 3 ? t('weather_partly') : code < 70 ? t('weather_cloudy') : t('weather_showers');
      async function fetchWithTimeout(input, init = {}, timeoutMs = 5000) { const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), timeoutMs); try { return await fetch(input, { ...init, signal: controller.signal }); } finally { clearTimeout(timer); } }
      try {
        const res = await fetchWithTimeout(`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(cityCoords.lat)}&longitude=${encodeURIComponent(cityCoords.lng)}&current=temperature_2m,weather_code&timezone=auto`);
        const data = await res.json();
        if (data.current) {
          document.getElementById('weather-temp').textContent = `${Math.round(data.current.temperature_2m)}°C`;
          document.getElementById('weather-desc').textContent = weatherText(Number(data.current.weather_code));
        }
      } catch {}

      const savedActs = window.AppState?.getActivities?.() || [];
      const daysActivities = Array.isArray(trip.itinerary) ? trip.itinerary : (savedActs.length ? [{ activities: savedActs, totalHours: savedActs.length * 2 }] : []);
      const tripBudget = Number(trip?.budget?.amount ?? trip?.budget ?? 0);
      const currentSpent = savedActs.reduce((sum, activity) => sum + Number(activity?.cost || activity?.price || 0), 0);
      const alerts = evaluateAlerts({ weatherDaily: Array.isArray(trip.weatherDaily) ? trip.weatherDaily : [], daysActivities, budget: tripBudget, currentSpent });
      document.getElementById('alerts-container').innerHTML = alerts.map((alert) => `<aside class="rounded-2xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-950 shadow-sm"><strong class="block mb-1">${t('proactive_alert')}</strong><span>${alert.message}</span></aside>`).join('');
      if (!savedActs.length) {
        document.getElementById('progress-bar').style.width = '0%';
        document.getElementById('progress-percent').textContent = '0%';
        document.getElementById('current-title').textContent = t('no_today_activity');
        document.getElementById('btn-arrived').classList.add('hidden');
      } else {
        document.getElementById('btn-arrived').classList.remove('hidden');
        document.getElementById('current-title').textContent = savedActs[0].title || savedActs[0].place || t('activity_first');
        let count = 0;
        document.getElementById('btn-arrived').addEventListener('click', () => {
          count = Math.min(100, count + 33);
          document.getElementById('progress-bar').style.width = count + '%';
          document.getElementById('progress-percent').textContent = count + '%';
          if (count >= 99) {
            document.getElementById('current-title').textContent = t('all_done');
            document.getElementById('btn-arrived').classList.add('hidden');
          }
        });
        const curAct = savedActs[0];
        const curCoords = curAct && (curAct.coords || (curAct.lat && curAct.lon ? { lat: curAct.lat, lng: curAct.lon } : null));
        if (curCoords && Number.isFinite(curCoords.lat) && Number.isFinite(curCoords.lng)) {
          const btnNav = document.getElementById('btn-navigate');
          btnNav.classList.remove('hidden');
          btnNav.addEventListener('click', () => {
            const p = new URLSearchParams({ dest: curCoords.lat + ',' + curCoords.lng, name: curAct.title || curAct.place || '', profile: 'walking' });
            location.href = './navigate.html?' + p.toString();
          });
          const btnMap = document.getElementById('btn-map');
          btnMap.classList.remove('hidden');
          btnMap.addEventListener('click', () => {
            const p = new URLSearchParams({ lat: curCoords.lat, lng: curCoords.lng, name: curAct.title || curAct.place || '' });
            location.href = './map.html?' + p.toString();
          });
          var btnDet = document.getElementById('btn-details');
          if (btnDet) { btnDet.classList.remove('hidden'); btnDet.href = './place.html?lat=' + curCoords.lat + '&lon=' + curCoords.lng + '&name=' + encodeURIComponent(curAct.title || curAct.place || ''); }
        }
      }
      renderSmartRecs(document.getElementById('smart-recs'), { coords: cityCoords });
    }
  </script>
<script defer src="./utils/header.js"></script>
</body>
</html>
