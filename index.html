<!DOCTYPE html>

<html data-i18n-title="title_home" dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>My Sindbad — رفيق السفر</title>
<meta content="#0a1122" name="theme-color"/>
<meta content="My Sindbad" name="application-name"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<meta content="My Sindbad" name="apple-mobile-web-app-title"/>
<link href="./manifest.json" rel="manifest"/>
<link href="./icons/app-icon.jpg" rel="icon" type="image/jpeg"/>
<link href="./icons/app-icon.jpg" rel="apple-touch-icon"/>
<link href="./utils/navigation.css" rel="stylesheet"/>
<link href="./utils/header.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="./utils/supabaseClient.js"></script>
<script defer src="./utils/auth.js"></script>
<script defer src="./utils/cityImages.js"></script>
<style>
:root {
  --navy-950: #060e1a;
  --navy-900: #0A192F;
  --navy-800: #243b53;
  --navy-700: #334e68;
  --navy-50: #f4f7fb;
  --gold: #D4AF37;
  --gold-dark: #b8941f;
  --gold-light: rgba(212, 175, 55, 0.12);
  --bg: #0a1122;
  --surface: rgba(26, 36, 58, 0.55);
  --border: rgba(255, 255, 255, 0.10);
  --border-subtle: rgba(255, 255, 255, 0.06);
  --text-main: #ffffff;
  --text-muted: #a0b0c8;
  --text-light: #8190a8;
  --danger: #fca5a5;
  --danger-light: rgba(220, 38, 38, 0.15);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 3px rgba(11, 27, 51, 0.04);
  --shadow-md: 0 4px 16px rgba(11, 27, 51, 0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', system-ui, -apple-system, sans-serif; }
html { scroll-behavior: auto; }
*, *::before, *::after { transition: color .18s ease, background-color .18s ease, border-color .18s ease, transform .18s ease; }
body {
  background: #0a1122;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  overflow-x: hidden;
}
.hidden { display: none !important; }
.en { font-family: 'Playfair Display', Georgia, serif; }

/* الهيكل الخارجي PWA Shell — Mobile First */
.shell {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.35);
}
@media (max-width: 480px) {
  .shell { box-shadow: none; }
}

.content { padding: 1.1rem 1rem; flex: 1; }

/* حقول الإدخال */
.inp {
  width: 100%;
  min-height: 44px;
  padding: 0.65rem 0.9rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 0.88rem;
  background: var(--surface);
  color: var(--text-main);
  box-sizing: border-box;
}
.inp:focus {
  outline: none;
  border-color: var(--navy-700);
  box-shadow: 0 0 0 3px rgba(11, 27, 51, 0.06);
}
label {
  display: block;
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 0.75rem;
}
label .inp { margin-top: 0.35rem; }

/* الأزرار */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  min-height: 44px;
  background: var(--navy-800);
  color: #fff;
  border: none;
  border-radius: var(--radius-md);
  padding: 0.65rem 1.2rem;
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  font-family: inherit;
  text-decoration: none;
}
.btn:active { transform: none; }
.btn.navy { background: var(--navy-800); color: #fff; }
.btn.navy:hover { background: var(--navy-900); }
.btn.ghost {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-main);
}
.btn.ghost:hover { background: var(--navy-50); border-color: var(--navy-700); }
.btn.sm { min-height: 36px; padding: 0.35rem 0.85rem; font-size: 0.78rem; border-radius: var(--radius-sm); }
.btn.w { width: 100%; }

/* عناوين الأقسام والبطاقات */
.sec {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--navy-900);
  font-weight: 700;
  font-size: 0.95rem;
  margin: 1.3rem 0 0.75rem;
}
.sec::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1rem;
  margin-bottom: 0.85rem;
  box-shadow: var(--shadow-sm);
}

/* بطاقة الحالة الفارغة الراقية */
.empty-state {
  text-align: center;
  padding: 2.2rem 1.2rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  margin: 0.85rem 0;
}
.empty-state .es-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--navy-50);
  color: var(--navy-800);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 0.85rem;
}
.empty-state h3 {
  font-size: 1.02rem;
  color: var(--navy-900);
  font-weight: 700;
  margin-bottom: 0.35rem;
}
.empty-state p {
  font-size: 0.8rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 1.1rem;
}

/* شاشة الدخول */
.auth {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% -10%, rgba(197,168,128,.22), transparent 34%),
    linear-gradient(180deg, var(--navy-950) 0%, var(--navy-900) 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2.2rem 1.4rem;
  text-align: center;
}
.auth .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 0.8rem; }
.auth .logo svg { display: block; width: 52px; height: 52px; flex: 0 0 auto; }
.auth .logo-copy { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
.auth .logo-copy strong { color: var(--gold); font: 700 1.35rem 'Playfair Display', Georgia, serif; }
.auth .logo-copy small { margin-top: 4px; color: #fff; font-size: .68rem; }
.auth h1 { font-size: 1.85rem; color: #ffffff; letter-spacing: 0.5px; margin-bottom: 0.15rem; }
.auth .tag { color: var(--gold); font-size: 0.76rem; letter-spacing: .4px; font-weight: 700; margin-bottom: 1.6rem; }
.auth-card {
  background: var(--surface);
  color: var(--text-main);
  border-radius: var(--radius-lg);
  padding: 1.5rem 1.25rem;
  width: 100%;
  max-width: 340px;
  text-align: right;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
}
.auth-card .tabs {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 3px;
  margin-bottom: 1.1rem;
}
.auth-card .tabs button {
  flex: 1;
  min-height: 38px;
  border: none;
  background: none;
  padding: 0.4rem;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.82rem;
  color: var(--text-muted);
  cursor: pointer;
  font-family: inherit;
}
.auth-card .tabs button.on { background: var(--surface); color: var(--navy-900); font-weight: 700; box-shadow: var(--shadow-sm); }
.auth-card .err { color: var(--danger); font-size: 0.75rem; min-height: 1.2rem; margin: 0.25rem 0; }
.auth-card .free {
  margin-top: 0.9rem;
  background: #f0fdf4;
  color: #15803d;
  border: 1px solid #bbf7d0;
  border-radius: var(--radius-sm);
  padding: 0.45rem;
  font-size: 0.72rem;
  font-weight: 600;
  text-align: center;
}
.auth .feat { display: flex; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap; justify-content: center; }
.auth .feat span {
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  color: #e2e8f0;
  border-radius: var(--radius-full);
  padding: 0.3rem 0.85rem;
  font-size: 0.7rem;
}

/* الهيدر العلوي */
.hdr {
  background: var(--surface);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0.7rem 1rem;
  padding-top: calc(0.75rem + env(safe-area-inset-top));
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  z-index: 30;
}
.hdr .brand { display: flex; align-items: center; gap: 0.65rem; }
.hdr .brand-logo { width: 38px; height: 38px; display: block; object-fit: cover; border-radius: 22%; flex-shrink: 0; }
.hdr .brand b { font-size: 1.02rem; color: var(--navy-900); display: block; line-height: 1.1; font-weight: 700; }
.hdr .brand small { color: var(--text-muted); font-size: 0.64rem; letter-spacing: 0.5px; }
.hdr .brand-copy { display:flex; flex-direction:column; align-items:flex-start; gap:.18rem; min-width:0; }
.hdr .brand-copy small { letter-spacing:0; }
.live-indicator { display:inline-flex; align-items:center; gap:.3rem; color:#15803d; font-size:.58rem; font-weight:700; white-space:nowrap; }
.live-indicator i { width:6px; height:6px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.13); animation:live-pulse 2s ease-in-out infinite; }
@keyframes live-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
.hdr .u { display: flex; align-items: center; gap: 0.6rem; }
.hdr .av {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--navy-50);
  border: 1px solid var(--border);
  color: var(--navy-900);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.84rem;
}
.hdr button {
  min-height: 36px;
  min-width: 36px;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 0.3rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
}
.hdr button:hover { color: var(--danger); background: var(--danger-light); }

/* الصفحة الرئيسية — ترويسة وبحث */
.home-hero {
  margin-bottom: 1.2rem;
  padding: 1.1rem;
  border-radius: var(--radius-lg);
  background:
    radial-gradient(circle at 100% 0%, rgba(197,168,128,.2), transparent 36%),
    linear-gradient(135deg, var(--navy-900), var(--navy-800));
  box-shadow: 0 10px 24px rgba(11, 27, 51, .14);
}
.home-hero .greeting { font-size: 0.8rem; color: #d9e2ef; font-weight: 600; margin-bottom: 0.2rem; display: block; }
.home-hero h2 { font-size: 1.35rem; color: #ffffff; font-weight: 800; line-height: 1.3; margin-bottom: 0.85rem; }
.home-search {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.3rem 0.45rem 0.3rem 0.85rem;
  box-shadow: 0 5px 14px rgba(6, 14, 26, .14);
}
.home-search:focus-within { border-color: var(--navy-700); }
.home-search .inp { border: none; padding: 0.45rem 0; font-size: 0.86rem; flex: 1; min-height: auto; }
.home-search .inp:focus { box-shadow: none; }
.home-search .btn { min-height: 36px; padding: 0.45rem 0.9rem; }
.hero-carousel-dots { display:flex; justify-content:center; gap:.4rem; margin-top:.8rem; }
.hero-dot { width:8px; height:8px; padding:0; border:1px solid rgba(255,255,255,.75); border-radius:50%; background:transparent; cursor:pointer; }
.hero-dot.active { background:#D4AF37; border-color:#D4AF37; transform:scale(1.2); }

/* تصنيفات واختصارات سريعة */
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.55rem; margin-bottom: 1.1rem; }
.cat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.75rem 0.3rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--navy-900);
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 3px 10px rgba(11, 27, 51, .05);
  min-height: 72px;
  justify-content: center;
}
.cat:hover { border-color: var(--navy-700); background: var(--navy-50); }
.cat .ci {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--navy-50);
  color: var(--navy-800);
  display: flex;
  align-items: center;
  justify-content: center;
}
.cat:hover .ci { background: var(--navy-800); color: #fff; }
.destination-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
.destination-card {
  position: relative;
  min-height: 176px;
  overflow: hidden;
  border-radius: var(--radius-lg);
  background: var(--navy-900);
  color: #fff;
  border: 1px solid rgba(255,255,255,.14);
  text-align: right;
  cursor: pointer;
  padding: 0;
  font-family: inherit;
}
.destination-card::after {
  content: '';
  position: absolute;
  inset: 35% 0 0;
  background: linear-gradient(180deg, transparent, rgba(6,14,26,.88));
}
 .destination-card img { width: 100%; height: 100%; position: absolute; inset: 0; object-fit: cover; opacity: .86; }
 .destination-card.image-fallback { background: linear-gradient(135deg, #0A192F, #D4AF37); }
 .destination-card.image-fallback::before { content: attr(data-city); position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; color: #fff; font-weight: 800; }
.destination-card .dc-copy { position: absolute; inset: auto .85rem .75rem; z-index: 1; }
.destination-card b { display: block; font-size: .98rem; line-height: 1.2; }
.destination-card span { display: block; font-size: .68rem; color: #e4eaf2; margin-top: .25rem; }
.destination-card .dc-arrow { position: absolute; top: .7rem; left: .7rem; z-index: 1; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--navy-900); display: grid; place-items: center; font-size: .9rem; }
@media (max-width: 350px) {
  .destination-grid { grid-template-columns: 1fr; }
}

/* الشرائح والكبسولات */
.row { display: flex; gap: 0.45rem; overflow-x: auto; padding-bottom: 0.35rem; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-full);
  padding: 0.45rem 0.95rem;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
}
.chip:hover { border-color: var(--navy-700); color: var(--navy-900); }
.chip.on {
  background: var(--navy-800);
  border-color: var(--navy-800);
  color: #ffffff;
}

/* خط الرحلة والتجهيز */
.trip-summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1rem;
  margin-bottom: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow-sm);
}
.trip-summary h2 { font-size: 1.05rem; color: var(--navy-900); font-weight: 700; margin-bottom: 0.2rem; }
.trip-summary p { color: var(--text-muted); font-size: 0.76rem; }
.timeline { border-right: 2px solid var(--border); padding-right: 0.9rem; margin: 0.5rem 0.5rem 0.9rem 0; }
.tl { position: relative; margin-bottom: 0.75rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.6rem 0.75rem; }
.tl::before {
  content: '';
  position: absolute;
  right: -1.25rem;
  top: 0.75rem;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  border: 2px solid var(--surface);
}
.tl b { font-size: 0.84rem; color: var(--navy-900); }
.tl small { color: var(--text-muted); display: block; font-size: 0.72rem; margin-top: 0.15rem; }
.tl .del { float: left; background: none; border: none; color: var(--text-light); cursor: pointer; padding: 0.2rem; min-height: 28px; min-width: 28px; }
.tl .del:hover { color: var(--danger); }
.day-h {
  background: var(--navy-50);
  color: var(--navy-900);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.3rem 0.7rem;
  font-size: 0.76rem;
  font-weight: 700;
  margin: 0.7rem 0 0.5rem;
  display: inline-block;
}
.check {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.84rem;
  min-height: 40px;
}
.check input { accent-color: var(--navy-800); width: 18px; height: 18px; cursor: pointer; }
.check .done { text-decoration: line-through; color: var(--text-light); }
.prog { height: 6px; background: var(--border); border-radius: var(--radius-full); overflow: hidden; margin: 0.5rem 0 0.8rem; }
.prog i { display: block; height: 100%; background: var(--gold); border-radius: var(--radius-full); }

/* الخريطة والأدوات */
iframe.map { width: 100%; height: 240px; border: 1px solid var(--border); border-radius: var(--radius-md); }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; margin-top: 0.65rem; }
.wth b { font-size: 1.5rem; color: var(--navy-900); font-weight: 800; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }

/* المجتمع */
.post { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 0.85rem; box-shadow: var(--shadow-sm); }
.post img { width: 100%; height: 170px; object-fit: cover; display: block; }
.post .noimg { height: 110px; background: var(--navy-50); display: flex; align-items: center; justify-content: center; color: var(--text-light); }
.post .pb { padding: 0.75rem 0.85rem; }
.post .pb p { font-size: 0.82rem; color: var(--text-main); margin-bottom: 0.45rem; line-height: 1.5; }
.post .pm { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 0.72rem; }
.post .like { display: flex; align-items: center; gap: 0.3rem; background: none; border: none; color: var(--danger); cursor: pointer; font-family: inherit; font-size: 0.74rem; font-weight: 700; padding: 0.2rem 0; min-height: 32px; }

/* المحادثة / مساعد السفر */
.chat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.85rem;
  height: 320px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  margin-bottom: 0.65rem;
}
.msg { max-width: 82%; padding: 0.65rem 0.9rem; border-radius: var(--radius-md); font-size: 0.82rem; line-height: 1.6; white-space: pre-line; }
.msg.bot { background: var(--bg); color: var(--text-main); align-self: flex-start; border-bottom-right-radius: 2px; border: 1px solid var(--border-subtle); }
.msg.me { background: var(--navy-800); color: #ffffff; align-self: flex-end; border-bottom-left-radius: 2px; }
.sugs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.65rem; }

/* شريط التنقل السفلي — Mobile Native */
.bnav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 440px;
  background: var(--surface);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  z-index: 40;
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 16px rgba(11, 27, 51, 0.04);
  padding: 0.35rem 0 calc(0.35rem + env(safe-area-inset-bottom));
}
.bnav button {
  flex: 1;
  min-height: 48px;
  background: none;
  border: none;
  color: var(--text-muted);
  padding: 0.3rem 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 0.65rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  position: relative;
}
.bnav button:active { transform: none; }
 .bnav button.on { color: #ffcc33; font-weight: 700; }

function applyDynamicTheme() {
  if (!window.MySindbadTimeUtils || !session) return;
  const { getTimePeriod, getGreeting, getBackgroundConfig } = window.MySindbadTimeUtils;
  const period = getTimePeriod();
  const greeting = getGreeting();
  const bgClasses = getBackgroundConfig();
  const greetingElement = document.getElementById('greeting-text') || document.querySelector('h1');
  if (greetingElement) { greetingElement.dataset.i18n = `greeting_${period}`; greetingElement.textContent = t(`greeting_${period}`, greeting); }

  // Preserve the app's existing body classes while adding the dynamic theme classes.
  document.body.classList.add(...bgClasses.split(/\s+/), 'transition-all', 'duration-700', 'ease-in-out', 'min-h-screen');
  document.body.dataset.timePeriod = period;

  // The project is plain HTML/JS, so provide a visual fallback when Tailwind is not loaded.
  const fallbackBackgrounds = {
    fajr: 'linear-gradient(to bottom, #0A192F, #334e68)',
    morning: 'linear-gradient(to bottom, #38bdf8, #bae6fd)',
    day: 'linear-gradient(to bottom, #93c5fd, #dbeafe)',
    sunset: 'linear-gradient(to bottom, #fb923c, #f472b6, #a855f7)',
    night: '#0A192F'
  };
  document.body.style.background = fallbackBackgrounds[period];
}

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function authHTML(){return `

 </div>`;}
 async function doLogin(){const email=$('aEmail').value.trim(),pass=$('aPass').value;
  if(!email||!pass){$('aErr').textContent=t('enter_credentials');return;}
  try{if(window.supabaseConfigured){const user=await Auth.signIn(email,pass);session={name:user.user_metadata?.full_name||user.email,email:user.email};ls('sb_session',session);render();return;}
   const u=lg('sb_users',[]).find(x=>x.email===email&&x.pass===pass);if(u){session={name:u.name,email:u.email};ls('sb_session',session);render();}else $('aErr').textContent=t('invalid_credentials');
  }catch(error){$('aErr').textContent=t('login_error')+': '+(error.message||t('verify_data'));}}
 async function doReg(){const name=$('rName').value.trim(),email=$('aEmail').value.trim(),pass=$('aPass').value;
 if(!name||!email||pass.length<4){$('aErr').textContent=t('register_required');return;}
  try{if(window.supabaseConfigured){const user=await Auth.signUp(email,pass,name);if(!user){$('aErr').textContent=t('verify_email');return;}session={name:user.user_metadata?.full_name||name,email:user.email};ls('sb_session',session);render();return;}
   const u=lg('sb_users',[]);if(u.find(x=>x.email===email)){$('aErr').textContent=t('email_registered');return;}u.push({name,email,pass});ls('sb_users',u);session={name,email};ls('sb_session',session);render();
  }catch(error){$('aErr').textContent=t('register_error')+': '+(error.message||t('verify_data'));}}
function doOut(){session=null;ls('sb_session',null);render();}

const ensureCityImagesLoaded = (callback) => {
  if (window.MySindbadCity && window.MySindbadCity.normalizeCityImage) {
    callback();
    return;
  }
  const checkInterval = setInterval(() => {
    if (window.MySindbadCity && window.MySindbadCity.normalizeCityImage) {
      clearInterval(checkInterval);
      callback();
    }
  }, 50);
  setTimeout(() => clearInterval(checkInterval), 5000);
};
function startHeroCarousel(){const hero=document.querySelector('.home-hero'),dots=document.getElementById('hero-carousel-dots');if(!hero||!dots)return;const cities=[[t('city_marrakech'),'marrakech'],[t('city_chefchaouen'),'chefchaouen'],[t('city_istanbul'),'istanbul']];let active=0;const paint=()=>{const [,cityKey]=cities[active];hero.style.backgroundImage=`linear-gradient(180deg,rgba(4,17,28,.18),rgba(4,17,28,.84)),url('${getCityImage(cityKey)}')`;dots.innerHTML=cities.map((item,index)=>`<button type="button" aria-label="${t('destination_image')} ${item[0]}" aria-pressed="${index===active}" class="hero-dot${index===active?' active':''}" data-hero-index="${index}"></button>`).join('');dots.querySelectorAll('[data-hero-index]').forEach((button)=>button.addEventListener('click',()=>{active=Number(button.dataset.heroIndex);paint()}))};paint();clearInterval(heroCarouselTimer);heroCarouselTimer=setInterval(()=>{active=(active+1)%cities.length;paint()},5000)}
